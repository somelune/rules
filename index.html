e vais inviter tes parents."], ["I *want to* (pas *wanna*) continue.", "Je veux continuer."]]}, {"id": "178", "rule": "'photographie' Si c'est l'art, c'est photography ; si c'est un objet, c'est photograph.", "ex": [["Look at this *photograph*!", "Regarde cette *photographie* !"], ["I like music and *photography*.", "J'aime bien la musique et la *photographie*."], ["I love *photography*.", "J'aime la *photographie*."], ["I love this *photograph*.", "J'aime cette *photographie*."]]}, {"id": "179", "rule": "La date : les noms des jours et des mois s'écrivent avec une majuscule (et les noms propres, comme en français).", "ex": [["*May*", "*mai*"], ["*Saturday*", "*samedi*"], ["Entrance is free on *Thursdays*.", "L'entrée est gratuite *le jeudi*."], ["The festival takes place in *March*, on a *Monday*.", "Le festival a lieu en *March*, un *Monday*."]]}, {"id": "180", "rule": "Quand on s'exclame sur une chose avec _such_ (=si/tellement), on inverse _a/an_ et _such_.", "ex": [["It's *such a* nice idea!", "C'est *une idée tellement sympa* !"], ["I've never prepared *such a* simple sandwich.", "Je n'ai jamais préparé un sandwich *aussi* simple."], ["It's *such an* excellent excuse!", "C'est *une excuse tellement excellente* !"], ["He's *such a* weird guy...", "C'est *un gars si bizarre*…"]]}, {"id": "181", "rule": "Quand on s'exclame sur une chose avec _what_ (=quel/quelle), on ajoute_ a/an_ et on n'oublie pas que l'adjectif se place avant le nom.", "ex": [["*What an amazing view!*", "*Quelle vue merveilleuse !*"], ["*What a* shame!", "*Quel* dommage !"], ["*What a* lovely thing to do!", "*Quelle* chose adorable (à faire/a été faite) !"], ["*What a* special fruit!", "*Quel* fruit spécial !"], ["*What* long instructions!", "*Quelles* longues instructions !"]]}, {"id": "182", "rule": "'celui-ci'' se traduit par _this one_ et 'celui-là' se traduit par _that one_", "ex": [["*This one* is alright but *that one* has gone off.", "*Celui-ci* est bien mais *celui-là* a tourné"], ["*That one* is from France.", "*Celui-là* est de France."], ["*This one* is ok.", "*Celui-ci* est ok."], ["This dragon is bigger than *that one*.", "Ce dragon-ci est plus grand que *celui-là*."]]}, {"id": "183", "rule": "'Comme c'est + (adjectif) ! ' se traduit par _How_ + (adj) !", "ex": [["*How nice* of you!", "*Comme c'est gentil* de ta part!"], ["*How sweet*!", "*Comme c'est mignon*!"], ["*How intelligent*!", "*Comment c'est intelligent*!"], ["*How dangerous* the dragon is!", "*Comme le dragon est dangereux* !"]]}, {"id": "184", "rule": "Pour dire le sentiment de manque, on inverse sujet et complément.", "ex": [["I *miss* you.", "Tu *me manques*."], ["I *miss* her smile.", "Son sourire *me manque*."], ["Do you *miss* me?", "Est-ce que je *te manque* ?"], ["He *misses* our parents.", "Nos parents *lui manquent*."]]}, {"id": "185", "rule": "'ceux-ci' se traduit par _these ones_ et 'ceux-là' par _those ones_. Les deux mots portent la marque du pluriel.", "ex": [["I like *these ones*.", "J'aime bien *celles-ci*."], ["*Those ones* are weird.", "*Celles-là* sont bizarres."], ["*These ones* are large.", "*Ceux-ci* sont larges."], ["*Those ones* are from Canada.", "*Ceux-là* sont du Canada."]]}, {"id": "186", "rule": "La date : le numéro du jour est un nombre ordinal (premier, deuxième, troisième plutôt que un, deux, trois).", "ex": [["The first of September.", "Le premier septembre."], ["On *the nineteenth*.", "*Le dix-neuf*."], ["*the 4th* May", "*le 4* mai"], ["*the 23rd* July", "*le 23* juillet"], ["The festival takes place on *the third* of March.", "Le festival a lieu *le trois mars*."]]}, {"id": "187", "rule": "L'heure : les heures se comptent non jusqu'à 24 mais jusqu'à 12 et en recommançant. On précise le moment de la journée si ce n'est pas évident.", "ex": [["It’s *one o’clock in the afternoon*.", "Il est *treize heure*."], ["*Two pm*.", "*Quatorze heures*."], ["*six o'clock in the evening*", "*dix-huit heures* (traditionnel)"], ["*six pm*", "*dix-huit heures* (moderne)"], ["The festival starts at *seven o'clock in the evening*.", "Le festival commence à *19h*."]]}, {"id": "188", "rule": "Certains adjectifs ne peuvent pas être juste à coté d'un nom : _afraid, alive, alone, asleep, aware, content, cross, drunk, glad, pleased, ill, well…_ (C'est le principe inverse de la règle 189.)", "ex": [["I'm *pleased* to meet you.", "Je suis *contente* de faire ta connaisance."], ["*pleased* + girl = a *happy* girl ~(~'a pleased girl'~ est impossible)~", "une fille *contente*"]]}, {"id": "189", "rule": "Certains adjectifs ne peuvent pas être éloigné d'un nom : _mere, sheer, utter, ..._. (C'est le principe inverse de la règle 188.)", "ex": [["It was *mere* chance.", "C'était un *pur* hasard."], ["He did it out of *utter* stupidity.", "Il l'a fait par stupidité *complète*."]]}, {"id": "190", "rule": "Titre d'œuvres : il faut mettre des majuscules à tous les mots lexicaux puis, quand on écrit à la main, le souligner, ou, en dactylographiant, le mettre en italiques.", "ex": [["*Great Expectations* is amazing.", "*Les Grandes Espérances* est génial."], ["*Harry Potter and the Chamber of Secrets*", "*Harry Potter et la chambre des secrets*"]]}, {"id": "191", "rule": "'comme' se traduit par _like_ ou _such_ as introduire un exemple, et par _as_ avant une proposition ou pour 'comme-en tant que'.", "ex": [["I love you *as* a friend.", "Je t'aime *comme* ami."], ["You are *like* your father.", "Tu es *comme* ton père."]]}, {"id": "192", "rule": "Le sujet de la principale peut également être le complément de la subordonnée. (On appelle cela la montée de l'objet et c'est similaire à ce qui est décrit dans la règle 193 et cela existe parfois en français aussi.)", "ex": [["*She*'s easy to work with. = It is easy to work with *her*.", "Il est facile de travailler avec *elle*."], ["*John* is tough to please. = It is tought to please *John*.", "Il est dur de satisfaire *John*."], ["*This book* is impossible to understand. = It is impossible to understand *this book*.", "*Ce livre* est impossible à comprendre. = Il est impossible de comprendre *ce livre.*"]]}, {"id": "193", "rule": "Le sujet de la principale peut également être celui de la subordonnée. (C'est un peu similaire à ce qui est décrit dans la règle 192. Cela s'appelle la montée du sujet et cela existe en français aussi.)", "ex": [["*She*'s likely to come. = It is likely that *she* comes.", "Il est probable qu'*elle* vienne."], ["*The prince* seems to admire the princess. = It seems that *the prince* admires the princess.", "*Le prince* semble admirer la princesse."]]}, {"id": "194", "rule": "Ponctuation : le tiret long est davantage utilisé en anglais qu'en français où on lui préfère des virgules ou des parenthèses pour insérer des commentaires.", "ex": [["I'm late *— *sorry !", "Je suis en retard, désolé !"], ["The princess *—* courageous and proud *—* protects the village.", "La princesse*,* courageuse et fière*,* protège le village."]]}, {"id": "195", "rule": "Dans les coordinations du type 'le pingouin et moi', on emploie _I_ pour 'moi' quand c'est le sujet, _me_ quand c'est l'objet.", "ex": [["My flatmate *and I* are revising.", "Mon colocataire *et moi* révisons."], ["She gave it to my brother and *me*.", "Elle l'a donné à mon frère et *moi*."]]}, {"id": "196", "rule": "Pour exprimer un souhait ou un regret avec _wish_, le verbe qui suit peut se mettre en to + V (souhait), au prétérit (regret présent) ou au _past_ perfect (regret passé) ; on n'utilise jamais _would_ juste après _wish_.", "ex": [["I wish *to have* more time.", "Je souhaite *avoir* plus de temps."], ["I wish *I had* more time.", "Je regrette *de ne pas avoir* plus de temps."], ["I wish *I had had* more time.", "Je regrette *de ne pas avoir eu* plus de temps."], ["She *wishes she had studied* more.", "Elle *regrette de ne pas avoir plus étudié*."]]}, {"id": "197", "rule": "Quand plusieurs adjectifs épithètes précèdent un nom, ils suivent en général un ordre précis : opinion, taille, âge, forme, couleur, origine, matière, fonction, puis le nom.", "ex": [["a *nice big old brown* jacket", "?! (La veste est vieille, grosse, chouette et marron...)"], ["*cool old orange Canadian cotton* costume", "*vieux* costume *cool en cotton orange du Canada*"], ["She bought a *beautiful small antique French* vase.", "Elle a acheté un *beau petit* vase *français ancien*."]]}, {"id": "198", "rule": "Certains verbes se construisent avec complément d'objet + _to_ + verbe, quand le sujet du deuxième verbe est différent de celui du premier : _want someone to do something, expect someone to do something, tell someone to do something_.", "ex": [["I *want you to leave*.", "Je *veux que tu partes*."], ["The teacher *told them to be* quiet.", "Le professeur *leur a dit de se taire*."]]}, {"id": "199", "rule": "Pour exprimer une partie d'un tout ('certains d'entre ...', `la plupart d'entre ...', 'deux tiers d'entre ...'), on utilise une structure avec _of_ : _some of_, _most of_, _two_ thirds _of_ + groupe nominal ou pronom.", "ex": [["*Some of* them are late.", "*Certains d'entre eux* sont en retard."], ["*Most of* us agree.", "*La plupart d'entre nous* sont d'accord."]]}, {"id": "200", "rule": "_who, whose _et _whom_ : 'dont' exprimant la possession se traduit par le pronom relatif _whose_ + nom. _Who_ remplace le sujet et _whom_ (plus formel) remplace le complément d'objet d'une proposition relative.", "ex": [["The man *whose* car was stolen called the police.", "L'homme *dont* la voiture a été volée a appelé la police."], ["The woman *whom* I met yesterday is a doctor.", "La femme *que* j'ai rencontrée hier est médecin."]]}, {"id": "a", "rule": "Le e final de _the_ se prononce /_i_/ si le mot qui suit commence par un son-consonne.", "ex": [["the egg (en fausse phonétique : thi èg)", "l'oeuf"], ["the cat (en fausse phonétique : the kat)", "le chat"]]}, {"id": "b", "rule": "Dans certains mots, il y a des syllabes muettes : _clothes_, _favourite_, _different_, _chocolate_.", "ex": [["clothes (= en fausse phonétique : kleuouthze)", "vêtements"], ["favourite (=en fausse phonétique, fèïvreut)", "préféré"]]}, {"id": "c", "rule": "Il y a des sons qui n'existent pas en français: /r/, les deux <th>, /h/ et certaines voyelles.", "ex": [["Hello, Rabbit! (le /h/ et le /r/)", "Bonjour, Lapin !"], ["Three thirsty thieves took their bath on Thursday. (le /th/)", "Trois brigands assoiffés prirent leur bain jeudi."]]}, {"id": "d", "rule": "Certaines consonnes sont parfois muettes.", "ex": [["know (le <k> est muet)", "connaître"], ["bomb (le deuxième <b> est muet)", "bombe"]]}, {"id": "e", "rule": "Il y a une distinction entre des sons-voyelles longs et des sons-voyelles courts.", "ex": [["cat (= /kat/)", "chat"], ["cart (= /k*at*/ en allongeant ce son /a/ qui est plus ouvert)", "charette"], ["pot (= /pot/)", "pot"], ["port (= /p*o*t/ en allongeant un peu le son /o/ qui est moins ouvert)", "port"], ["ship (= /shép/)", "navire"], ["sheep (= /sh*i*p/ en allongeant un peu le son /i/)", "mouton"]]}, {"id": "f", "rule": "Il y a plus fréquemment des sons-voyelles doubles (aka. diphtongues).", "ex": [["Hi, how's it going? (= /h*aï* h*aou* zét g*euou*éng/", "Salut, comment ça va ?"]]}, {"id": "g", "rule": "La terminaison -s : il se prononce de trois manières, en fonction de ce qui précède.", "ex": [["cats (= /kat*s*/)", "chats"], ["dogs (= /dog*z*/)", "chiens"], ["houses (= /haouz*éz*/", "maisons"]]}, {"id": "h", "rule": "La terminaison -ed se prononce de trois manières différents en fonction de ce qui précède.", "ex": [["liked (= /laïk*t*/", "aimé, apprécié"], ["decided (= /désaïd*éd*/", "décidé"], ["played (= /plèï*d*/", "joué"], ["wished (= /wésh*t*/", "souhaité"]]}, {"id": "i", "rule": "Dans la phrase, on tend à faire tomber les syllabes accentuées sur un battement : on dit les autres syllabes plus ou moins rapidement pour que cela coincide.", "ex": []}, {"id": "j", "rule": "Les accents sont très importants ; autrement dit, le fait que certaines syllables soient plus fortes par rapport à d'autres n'est pas accessoire.", "ex": [["desert (= /dézet/ *Oo*)", "désert"], ["dessert ( = /dezeut/ *oO*)", "dessert"]]}, {"id": "k", "rule": "L'accent des mots à deux syllabes est souvent sur la première (Oo), sauf si celle-ci fonctionne comme préfixe.", "ex": [["perfect Oo", "parfait"]]}, {"id": "l", "rule": "L'acccent des mots à trois syllabes (et plus) est souvent sur l'avant-avant-dernière syllabe (Ooo ou oOoo ou ooOoo, etc.).", "ex": [["finally Ooo", "finalement"]]}, {"id": "m", "rule": "0 se prononce de trois manières : /zéeureuou/ ou /euou/ ou /no:t/", "ex": []}, {"id": "n", "rule": "Quand on prononce 100 ou 1000, on met _one_ devant.", "ex": [["100 = one hundred", "cent"]]}, {"id": "o", "rule": "Les nombres : Quand le nombre se finit par 1 ou 10, on prononce un _and_ juste avant.", "ex": [["two thousand *and* one.", "deux mille un"]]}, {"id": "p", "rule": "La lettre alphabétique Z se dit /zi/ en Anglais américain et /zèd/ en Anglais britannique.", "ex": [["X, Y, Z = /èks waï zi/\nX, Y, Z = /èks waï zed/", "X, Y, Z = /iks, igrek, zèd/"]]}, {"id": "q", "rule": "Pour mettre en relief un élément à l'oral, le français tend à utiliser un changement de syntaxe alors que l'anglais utilisera une accentuation sonore.", "ex": [["I did it.", "C'est moi qui l'ai fait."]]}, {"id": "r", "rule": "L'intonation est descendante dans les questions qui commencent par un mot interrogatif.", "ex": [["What’s the time?", "Quelle heure est-il ?"], ["Where are you from?", "D'où viens-tu ?"], ["What's your name?", "Comment tu t'appelles ?"]]}, {"id": "s", "rule": "'que' Quand _that_ commence une subordonnée, il n'est pas accentué.", "ex": [["I think that he's honest. = /aï thénk theut hiz onest/", "Je pense qu'il est honnête."]]}];
const $=s=>document.querySelector(s);
const E=(t,c,x)=>{const e=document.createElement(t);if(c)e.className=c;if(x!==undefined)e.textContent=x;return e};
function hl(d,s){s.split(/(\*+[^*]+\*+|_[^_]+_|~[^~]+~)/).forEach(x=>{let m=x.match(/^\*+([^*]+)\*+$/);if(m){d.append(E("mark","",m[1]));return}m=x.match(/^~([^~]+)~$/);if(m){d.append(E("span","rm",m[1]));return}m=x.match(/^_([^_]+)_$/);d.append(m?E("em","",m[1]):document.createTextNode(x))});return d}
function rich(d,t){t.split("\n").forEach(l=>{const m=/^\s*[-\u2022]\s+/.test(l),row=E("div",m?"bul":"ln");hl(row,m?l.replace(/^\s*[-\u2022]\s+/,""):l);if(!l.trim())row.style.height=".6em";d.append(row)});return d}
const OPEN=new Set();
function card(r){const d=E("details");d.open=OPEN.has(r.id);const s=E("summary");s.append(E("span","id",r.id));
 const rt=E("div","rt");rich(rt,r.rule||"");s.append(rt);d.append(s);
 const b=E("div","body");if(r.ex.length)r.ex.forEach(x=>{const p=E("div","pair");p.append(hl(E("div","en"),x[0]),hl(E("div","fr"),x[1]));b.append(p)});else b.append(E("div","none","Pas encore d’exemples."));
 d.append(b);d.ontoggle=()=>d.open?OPEN.add(r.id):OPEN.delete(r.id);return d}
function render(){const q=$("#q").value.toLowerCase().trim(),L=$("#list");L.replaceChildren();
 D.filter(r=>!q||(r.id+" "+r.rule+" "+r.ex.flat().join(" ")).toLowerCase().replace(/[*_~]/g,"").includes(q)).forEach(r=>L.append(card(r)))}
$("#q").oninput=render;render();
</script></body></html>
