<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><title>English rules</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--bg:#f7f6f2;--card:#fff;--tx:#1d1d1b;--mut:#6b6a63;--bd:#dcdad2;--ac:#1f5fa8}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#17181a;--card:#222427;--tx:#ecebe6;--mut:#a3a29a;--bd:#3a3c40;--ac:#6aa5e8}}
:root[data-theme=dark]{--bg:#17181a;--card:#222427;--tx:#ecebe6;--mut:#a3a29a;--bd:#3a3c40;--ac:#6aa5e8}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
main{max-width:880px;margin:0 auto;padding:16px}
h1{font-size:1.5rem;margin:0 0 8px}
.bar{position:sticky;top:env(safe-area-inset-top,0px);background:var(--bg);padding:8px 0;z-index:2;display:flex;flex-wrap:wrap;gap:8px}
input{font:inherit;color:var(--tx);background:var(--card);border:1px solid var(--bd);border-radius:8px;padding:8px 10px;flex:1 1 220px}
details{background:var(--card);border:1px solid var(--bd);border-radius:10px;margin:8px 0}
summary{cursor:pointer;padding:10px 12px;list-style:none;display:flex;gap:10px;align-items:flex-start}
summary::-webkit-details-marker{display:none}
.rt{flex:1}
.body{padding:2px 12px 12px 12px;border-top:1px solid var(--bd)}
.pair{display:flex;gap:16px;align-items:baseline;padding:5px 0;border-bottom:1px dotted var(--bd)}.pair:last-child{border-bottom:0}
.en{flex:1 1 55%;font-style:italic}.fr{flex:1 1 40%;font-size:.8rem}
@media (max-width:520px){.pair{flex-direction:column;gap:0}.fr{flex:none}}
mark{background:none;color:inherit;font-weight:700}
em{font-style:italic}.rm{font-style:normal}
.bul{padding-left:1.2em;position:relative}.bul:before{content:"\2022";position:absolute;left:.3em}
.none{color:var(--mut);padding-top:8px}
.id{background:var(--ac);color:#fff;border-radius:6px;padding:1px 8px;font-weight:600;font-size:.85rem;flex:none;min-width:1.6em;text-align:center}
.stamp{color:var(--mut);font-size:.8rem;margin:16px 0 4px;text-align:center}
</style></head><body><main>
<h1>English rules</h1>
<div class="bar"><input id="q" type="search" placeholder="Rechercher une règle ou un exemple…"></div>
<div id="list"></div>
<div class="stamp">Dernière mise à jour : 30/10/2026</div></main>
<script>
const D=[{"id": "1", "rule": "Le verbe 'aller' est suivi de la préposition _to_ : _go to_, _went to_, _going to_, _goes to_.", "ex": [["I went *to* the gym.", "Je suis allée *à* la salle de sport."], ["They go *to* the café.", "Ils vont *au* café."], ["They went *to* France.", "Ils sont allés *en* France."], ["The pirate goes *to* the festival.", "Le pirate va *au* festival."], ["Does this bus go *to* Picadilly Gardens?", "Est-ce que ce bus va *aux* Picadilly Gardens ?"]]}, {"id": "2", "rule": "'pour' se dit _for_ quand il est suivi d'un groupe nominal et _to_ quand il est suivi d'un verbe.", "ex": [["It's a message *for* the club.", "C'est un message *pour* le club."], ["It's an article *to* present the club.", "C'est un article *pour* présenter le club."], ["I need change *for* the laundry.", "J'ai besoin de monnaie *pour* la laverie."], ["I need a plug *to* charge my phone.", "J'ai besoin d'une prise *pour* charger mon téléphone."], ["The lion is a danger *for* the clown.", "Le lion est un danger *pour* le clown."]]}, {"id": "3", "rule": "On écrit le ‘je’ anglais  _I_ en majuscule, même quand il n’est pas en début de phrase.", "ex": [["My cousin and *I* are invited.", "Mon cousin et *moi* sommes invités."], ["Can *I* smoke here?", "Est-ce que *je* peux fumer ici ?"], ["Have *I* got enough time?", "Est-ce que *j'*ai assez de temps ?"], ["You prepare, *I* present.", "Tu prépares, *je* présente."]]}, {"id": "4", "rule": "Après des prépositions comme _at_, _for_, _about_, _without_,… etc. un verbe a sa forme _Ving_.", "ex": [["You're excellent *at filming*.", "Tu es excellent *pour filmer*."], ["Can we just have a drink *without eating*?", "Peut-on juste prendre un verre *sans manger* ?"], ["It's a question *about filming* operas.", "C'est une question *sur le fait de filmer* des opéras."], ["My housemate are good *at cooking* curry.", "Mes colocataires sont bons *pour cuisiner* des plats au curry."]]}, {"id": "5", "rule": "Dans une phrase à deux verbes lexicaux (V1+V2), certains V1 obligent V2 à avoir sa forme _to_ + V, notamment \"vouloir + verbe\" =  _want to_ + verbe.", "ex": [["I *want to continue*.", "Je *veux continuer*."], ["I'd *like to buy* this book.", "J'*aimerais acheter* ce livre."], ["I *can't afford to buy* it.", "Je *ne peux pas me permettre de l'acheter*."], ["I *hope to see* you again.", "J'*espère te revoir*."]]}, {"id": "6", "rule": "On ne peut avoir qu'un seul mot négatif dans une phrase simple. Lorsqu'on emploie des adverbes négatifs comme _never_, _nobody_, _nothing_, le verbe doit donc être à l'affirmatif = pas de double négation.", "ex": [["I do*n't* have *any* change.", "Je *n'*ai *pas* de monnaie."], ["I do*n't ever* take milk in my tea.", "Je *ne* prends *jamais* de lait dans mon thé."], ["I invited *nobody*.", "Je *n'*ai invité *personne*."], ["I did*n't* invite *anybody*.", "Je *n'*ai invité *personne*."], ["I *never* take milk in my tea.", "Je *ne* prends *jamais* de lait dans mon thé."]]}, {"id": "7", "rule": "'un' ou 'une' se dit _a_ avant un mot qui commence par un son-consonne ou _an_ avant un mot qui commence par un son-voyelle.", "ex": [["*a* radio, *a* ticket, *a* hall, *a* t-shirt, *a* euro", "*une* radio, *un* ticket, *un* hall, *un* t-shirt, *un* euro"], ["an orange, an email, an instrument", "*une* orange, *un* email, *un* instrument"], ["I’m writing *an* essay.", "Je suis en train d'écrire *une* dissertation."], ["I'm on *a* history course", "Je suis *un* cursus d'histoire."]]}, {"id": "8", "rule": "‘le/la’ se traduit par (rien) quand une chose ne peut être comptée ou qu'on en parle de manière générale. = Pas d'article défini pour une généralité abstraite. (Par contre, si c'est spécifique, on utilise bien _the_.)", "ex": [["*Science* explores *nature*.", "*La science* explore *la nature*."], ["The film presents *surf*.", "Le film présente *le surf*."], ["Are you into *music*?", "Tu aimes bien *la musique* ?"], ["*Entrance* is free on Thursdays.", "*L'entrée* est gratuite le jeudi."], ["*Ambition* is important.", "*L'ambition* est importante."]]}, {"id": "9", "rule": "‘les/des’ se traduit par (rien) quand on parle de choses en général. = Pas d'article pour les généralités plurielles. (Par contre, si c'est spécifique, on utilise bien _the_.)", "ex": [["She passes *messages*.", "Elle passe *des messages*."], ["*Elephants* are special.", "*Les éléphants* sont spéciaux."], ["Where can we hire *bikes*?", "Où pouvons-nous louer *des vélos* ?"], ["Entrance is free on *Thursdays*.", "L'entrée est gratuite *les jeudis*."]]}, {"id": "10", "rule": "Le choix d'un possessif se fait en fonction du genre et du nombre du possesseur et non pas de ce qui est possédé.", "ex": [["Is it *his* wallet or *her* wallet?", "C'est *son* portefeuille *à lui* ou *son* portefeuille *à elle* ?"], ["It's *his* house.", "C'est *sa* maison *(à lui)*."], ["*Her* article is in *his* magazine.", "*Son* article *(à elle)* est dans *son* magazine *(à lui)*."], ["*His* surprise was a concert.", "*Sa* surprise *(à lui / pour lui)* était un concert."]]}, {"id": "11", "rule": "Le présent simple se forme avec la base verbale et, à la 3ème du singulier (il/elle), on ajoute _‘-s’ _(ou _'-es'_ quand le verbe se termine par _s, sh, ch, x, z _ou _o_). Il s'emploie pour les vérités générales, les habitudes, les commentaires sportifs, les titres d'articles, les indications scéniques et les blagues.", "ex": [["I *want* a coffee.", "Je *veux* un café."], ["He *wants* a coffee.", "Il *veut* un café."], ["My assistants *write* reports.", "Mes assistants *écrivent* des rapports."], ["My assistant *writes* reports.", "Mon assistant *écrit* des rapports."], ["Neil *coaches* the team.", "Neil *entraîne* l'équipe."], ["When *do* the shops open?", "Quand les magasins *ouvrent*-ils?"]]}, {"id": "12", "rule": "Le passé n'est pas composé. Le passé a une forme simple qui ne se conjugue pas: _-ed_ en terminaison si le verbe est régulier; s'il est irrégulier, le verbe a une forme passée qui lui est propre.  Le verbe 'être' a deux formes, _was_ et _were_.", "ex": [["They *invited* my parents.", "Ils *ont invité* mes parents."], ["The dragon *protected* the village.", "Le dragon *protégea* le village."], ["I *saw* your flatmate in the library.", "J'*ai vu* ta colocataire à la bibliothèque."], ["They *went* to the disco.", "Elles *sont allées* à la discothèque."]]}, {"id": "13", "rule": "Pour dire le métier ou la fonction de quelqu’un, on met_ a_ ou _an_ juste avant.", "ex": [["I’m *a* vegetarian.", "Je suis végétarien."], ["My mother is *a* doctor.", "Ma mère est médecin."], ["She's *a* guide.", "Elle est guide."], ["He's *a* manager.", "Il est manager."]]}, {"id": "14", "rule": "Quand on généralise, on emploie davantage le pluriel (sans article) là où le français emploierait un singulier défini.", "ex": [["What's your favourite animal? - *Dogs*.", "Quel est ton animal préféré ? - *Le chien*."], ["Entrance is free on *Thursdays*.", "L'entrée est gratuite *le jeudi*."], ["*Elephants* are special.", "*L'éléphant* est spécial."], ["I prefer *lions*.", "Je préfère *le lion*."]]}, {"id": "15", "rule": "Pas de présent de narration. Si on raconte, on emploie le passé — et d'autant plus pour une histoire passée.", "ex": [["Churchill *decided* to evacuate.", "Churchill *décide* d'évacuer."], ["The invasion *started*.", "L'invasion *commence*."]]}, {"id": "16", "rule": "L’adverbe se place généralement juste avant le verbe quand il est seul (sauf quand c'est le verbe 'être').", "ex": [["I *sometimes* come here.", "Je *viens parfois* ici."], ["I *am never* alone.", "Je *ne suis jamais* seule."], ["I *often film* their matches.", "Je *filme souvent* leurs matchs."]]}, {"id": "17", "rule": "Pour poser une question, l'ordre auxiliaire-sujet est obligatoire. S'il n'y a ni 'être', ni auxiliaire (_be_, _have_, _can_, _must_, _should_, _may_, _will_ …etc.), on place _do_ avant le sujet et il  est le seul verbe conjugué.", "ex": [["*Is it* alright?", "*C'est* bon ?"], ["*Do you* camp?", "*Est-ce que tu* fais du camping?"], ["*Does he* camp?", "*Fait-il* du camping ?"], ["What *does this word mean*?", "Que *signifie ce mot* ?"], ["*Did the manager contact* the police?", "*Est-ce que le manager a contacté* la police?"]]}, {"id": "18", "rule": "'beaucoup de' se dit a _lot of_ ou _lots of_ . Ou bien, si on peut le remplacer par 'de nombreux' (= dénombrable), 'beaucoup de' peut se dire _many_ ; si on ne peut pas le remplacer par 'de nombreux' (= indénombrable), on utilisera _much_.", "ex": [["Do you know *a lot of* / *many* people?", "Tu connais *beaucoup de* gens ?"], ["*Lots of* love = *Much* love", "*Beaucoup d'*amour."], ["Do you go out *much*?", "Tu sors *beaucoup* ?"], ["We have *a lot of* tests.=  We have *many* tests.", "Nous avons *beaucoup de* tests."], ["There are *many* animals in the jungle.", "Il y a *beaucoup d'*animaux dans la jungle."], ["There is not *much* danger.", "Il n'y a pas *beaucoup de* danger."]]}, {"id": "19", "rule": "Dans une subordonnée commençant par une conjonction de temps comme _when_, là où le français mettrait du futur, l'anglais utilise du présent.", "ex": [["*When* I *work*, I'll pay tax.", "*Quand* je *travaillerai*, je paierai des impôts."], ["We'll ask *when* the waiter *arrives*.", "Nous demanderons *quand* le serveur *arrivera*."], ["*When* you *arrive*, I will decide.", "*Quand* tu *arriveras*, je déciderai."], ["We will continue the conversation *when* the police *contacts* us.", "Nous continuerons la conversation *quand* la police nous *contactera*."]]}, {"id": "20", "rule": "Comparer des choses : l'idée de supériorité se traduit par le suffixe _-er_ ajouté à l'adjectif s'il est court ; sinon, on utilise la structure _more_…_than_.", "ex": [["See you *later*!", "A *plus tard* !"], ["You're *more beautiful than* me.", "Tu es *plus belle que* moi."], ["The bus is *longer than* the tram.", "Le bus est *plus long que* le tram."], ["The match is *more important than* the set.", "Le match est *plus important que* le set."], ["The dragon is *bigger than* the lion.", "Le dragon est *plus grand que* le lion."]]}, {"id": "21", "rule": "Comparer des choses : le superlatif se traduit par le suffixe _-est_ ajouté à l'adjectif s'il est court ; sinon, on utilise la structure _the most_....", "ex": [["Where’s *the nearest* tube station?", "Où est la station de métro *la plus proche* ?"], ["It's *the most beautiful* thing in the world.", "C'est *la plus belle* chose au monde."], ["It's *the coolest* capital.", "C'est la capitale *la plus cool*."], ["It's *the most normal* mug.", "C'est le mug *le plus normal*."]]}, {"id": "22", "rule": "Génitif : quand on parle d’un lien de parenté ou d’une chose qui appartient à une personne, on relie les deux éléments en mettant _'s'_ entre les deux. Il y a un article défini (le = _the_) en moins et on met la personne qui \"possède\" en premier.", "ex": [["*my friend's jacket*", "*la veste de mon ami*"], ["*my parents' house*", "*la maison de mes parents*"], ["*The candidate's CV* mentions his experience.", "*Le CV du candidat* mentionne son expérience."], ["*My cousin's parents* are cool.", "*Les parents de mon cousin* sont cool."], ["*The fans' opinion* is important.", "*L'opinion des fans* est importante."]]}, {"id": "23", "rule": "ne…pas’ se dit en un seul mot _not_ qu’on met juste après le verbe 'être' _be_ ou après l'auxiliaire. S'il n'y a ni verbe 'être' _be_, ni auxiliaire (_be_, _have_, _can_, _must_, _will_, _should_…etc.), il faut ajouter _do_ et c'est lui qui se conjugue. _not_ est souvent contracté (on enlève le _o_ et on le colle à la fin de l'auxiliaire).", "ex": [["*I am not *sure. = *I'm not* sure.", "Je *ne* suis *pas* sûre."], ["The menu *is not* long. = The menu *isn't *long.", "Le menu *n'est pas* long."], ["I *do not* know. = I *don’t* know.", "Je *ne* sais *pas*."], ["He *does not* camp. = He *doesn't* camp.", "Il *ne* fait *pas* de camping."], ["I *cannot* ski. = I *can't* ski.", "Je *ne* sais *pas* skier."], ["They *haven't* explored the village.", "Ils *n'ont pas* exploré le village."]]}, {"id": "24", "rule": "Pour parler d'une partie du corps et pour les vêtements, 'le/la/les'  se traduit par un déterminant possessif.", "ex": [["Open *your* mouth!", "Ouvre *la* bouche !"], ["He changes *his* T-shirt often.", "Il change *de* T-shirt souvent."], ["He's opening *his* eyes !", "Il ouvre *les* yeux !"]]}, {"id": "25", "rule": "Parfois le mot est pluriel en anglais alors qu'il est singulier en français. Parfois, c'est l'inverse.", "ex": [["Where can I find tourist *information*?", "Où puis-je trouver des *informations* touristiques ?"], ["My *trousers* are dry.", "Mon *pantalon* est sec."], ["Your *hair* is orange!", "Tes *cheveux* sont oranges."]]}, {"id": "26", "rule": "'Combien' se dit _How much_ + (singulier)? ou bien _How many_ + (pluriel) ?.", "ex": [["*How much* does a return ticket cost?", "*Combien* coûte un aller-retour ?"], ["*How much* is the rent?", "Le loyer est de *combien* ?"], ["*How much* chocolate?", "*Quelle quantité de* chocolat?"], ["*How many* chocolates?", "*Combien de* chocolats?"]]}, {"id": "27", "rule": "Dans une phrase négative, 'de, de la, du, des' se traduit par (rien) ou _any_. Pour aller plus loin, voir règle 6 sur la double négation.", "ex": [["I don’t drink alcohol.", "Je ne bois pas *d'*alcool."], ["I didn't drink *any* alcohol.", "Je n'ai pas bu *d'*alcool."], ["I haven't prepared dessert. = I haven't prepared *any* dessert.", "Je n'ai pas préparé *de* dessert."], ["I don't have cash on me. = I don't have *any* cash on me.", "Je n'ai *pas de* liquide sur moi."]]}, {"id": "28", "rule": "Quand on compare des choses, 'que' se traduit par _as_ quand il y a égalité et _than_ quand il y a inégalité.", "ex": [["You're *faster than* me.", "Tu es *plus rapide que* moi."], ["You're *as fast as* me.", "Tu es *aussi rapide que* moi."], ["You're *as blond as* me.", "Tu es *aussi blond que* moi."], ["You're *blonder than* me.", "Tu es *plus blond que* moi."]]}, {"id": "29", "rule": "Certains mots anglais n'ont pas la même forme au singulier et au pluriel : ce sont des pluriels irréguliers (les réguliers, comme en français, prennent tout simplement un _-s_).", "ex": [["one animal, two animal*s*", "un animal, des *animaux* (pluriel régulier en anglais et irrégulier en français !)"], ["one man, two *men*", "une homme, deux *hommes*"], ["one woman, two *women*", "une femmes, deux *femmes*"], ["one child, two *children*", "un enfant, deux *enfants*"]]}, {"id": "30", "rule": "Certains noms sont toujours au pluriel, comme _people_ ou _trousers_. D’autres, comme _luggage_, sont indénombrables et s’emploient avec un verbe au singulier.", "ex": [["*People* are happy here.", "*Les gens* sont heureux ici."], ["Do you have *luggage*?", "Avez-vous des *bagages* ?"], ["My *shorts* are ok.", "Mon *short* est ok"], ["*People* are different.", "*Les gens* sont différents."]]}, {"id": "31", "rule": "'ce/cette' se traduit par _this_ ou _that_ et 'ces' se traduit par _these_ ou _those_, et le choix se fait sur le même principe que le choix entre 'ceci' et 'cela' en français.", "ex": [["What does *this* word mean?", "Que veut dire *ce* mot ?"], ["*That* lecturer is really funny.", "*Ce* professeur est vraiment drôle."], ["*This* steak is local: *these* burgers are excellent.", "*Ce* steak est local : *ces* burgers sont excellents."], ["*That* rap is horrible.", "*Ce* rap est horrible."]]}, {"id": "32", "rule": "'pas de = aucun' se dit _no_ quand il est accompagné d'un nom ou _none_ quand il n'est pas directement accompagné d'un nom.", "ex": [["*No* sugar, *no* milk.", "*Pas de* sucre, *pas de* lait."], ["*No* points for me!", "*Pas de* points pour moi."], ["*None* for me!", "*Aucun* pour moi !"], ["Did you see any shoes? - *None* that I liked.", "Tu as vu des chaussures? - *Aucunes* qui m'ont plu."]]}, {"id": "33", "rule": "'chaque' se traduit par _each_ pour mettre en valeur l'unité ou par _every_ pour mettre en valeur la totalité (// tous les).", "ex": [["I went to *every* lecture.", "Je suis allé à *chaque* cours."], ["*Each* lecture was great.", "*Chaque* cours était super."], ["*Every* weekend is different.", "*Chaque* weekend est différent."], ["*Each* dessert is excelllent.", "*Chaque* dessert est excellent."]]}, {"id": "34", "rule": "Pour exprimer le futur, on utilise principalement _will_. _Shall_ est aujourd’hui plus formel et sert surtout pour des suggestions ou dans un registre soutenu.", "ex": [["We *will* see.", "On *verra*."], ["We *shall* see.", "On *verra*."], ["You *shall* not pass.", "Vous *ne passerez pas*."], ["You *will* not pass.", "Vous *ne passerez pas*."]]}, {"id": "35", "rule": "Les pronoms possessifs sont en un mot : par exemple, 'le mien' se dit _mine_, puis 'le tien' : _yours_ puis _hers_, _his_, _ours_, _yours_, _theirs_.", "ex": [["*mine* ; *yours* ; *ours*", "*à moi* ; *le tien* ; *le notre*"], ["Is it your car? - No, it's *theirs*.", "Est-ce ta voiture ? - Non, c'est *la leur*."], ["The skateboard is *mine*.", "Le skateboard est *à moi*."], ["The scooter is *hers*.", "Le scooter est *à elle*."]]}, {"id": "36", "rule": "Le pronom complément se place après le verbe.", "ex": [["I love *you*.", "Je *t'*aime."], ["Can you show *me* on the map?", "Pouvez-vous *me* montrer sur la carte ?"], ["They contacted *me*.", "Ils *m'*ont contacté."], ["You completed *it*.", "Tu *l'*as complété."]]}, {"id": "37", "rule": "L'ordre des compléments, si ce sont deux pronoms, dans les verbes comme 'donner qqch à qqun' est : verbe + objet + _to_ + destinataire .", "ex": [["The lecturer gives *the students a handout*.", "Le professeur donne *un polycopié aux étudiants*."], ["The lecturer gave *it to them*.", "Le professeur *le leur* donna."], ["She passed *it to me*.", "Elle *me l'*a passé."]]}, {"id": "38", "rule": "Le present perfect s'emploie quand on parle bilans ou résultats. Il  se forme avec l'auxiliaire 'avoir' _have_ conjugué + participe passé du verbe.", "ex": [["What *have you been* up to?", "Qu'est-ce que tu *as fait* ces derniers temps ?"], ["*Have you done* any bar-work before?", "*Avez-vous* déjà *travaillé* dans un bar ?"], ["I *haven't decided*.", "Je *n'ai pas décidé*."], ["The taxi *has arrived*.", "Le taxi *est arrivé*."]]}, {"id": "39", "rule": "Le passif se forme pareil en anglais qu'en français, avec l'auxiliaire 'être' _be_ conjugué + verbe au participe passé (mais on l'emploie davantage).", "ex": [["The team *is coached* by Neil.", "L'équipe *est entraînée* par Neil."], ["The flat *had been cleaned*.", "L'appartement *a été nettoyé*."], ["We *are invited*.", "Nous *sommes invités*."], ["I *was contacted*.", "J'*ai été contactée*."], ["The village *is protected* by the prince.", "Le village *est protégé* par le prince."]]}, {"id": "40", "rule": "Le futur simple se traduit par l'auxilaire _will_ / 'll invariable + base verbale ; il a davantage une connotation de projet, de volonté.", "ex": [["*I’ll meet* you at the Students’ Union for lunch.", "Je te *retrouverai* à l'Union Etudiante pour déjeuner."], ["*We'll have to* go shopping soon.", "On *va devoir* faire les courses bientôt."], ["My blog *will present* the village.", "Mon blog *présentera* le village."], ["The garage *won't change*.", "Le garage *ne changera pas*."]]}, {"id": "41", "rule": "Le futur avec 'aller' se traduit par auxiliaire être _be_ conjugué + _going to_+ base verbale.", "ex": [["It’s *going to be* cold tomorrow.", "Il *va faire* froid demain."], ["I'm *going to invite* your parents.", "Je *vais inviter* tes parents."], ["I'm *going to be* sick.", "Je *vais vomir*."]]}, {"id": "42", "rule": "Les auxilaires modaux du type 'pouvoir' _can_ et 'devoir' _must_ sont invariables.", "ex": [["Where *can* we hire bikes?", "Où *pouvons-nous* louer des vélos ?"], ["*Can* you help me?", "*Pouvez-vous* m'aider ?"], ["We *can* change the posters.", "Nous *pouvons* changer les posters."], ["I *must* invite my parents.", "Je *dois* inviter mes parents."]]}, {"id": "43", "rule": "'peut-être' se traduit souvent par l'emploi d'un auxiliaire modal : _may_ ou, en cas de probabilité moins forte, _could_ ou _might_.", "ex": [["He *might* come.", "Il viendra *peut-être*."], ["That *might* be the case.", "Cela *pourrait* être le cas."], ["Your yukulele *may/might* arrive.", "Ton yukulélé *pourrait* arriver."], ["Your yukulele *could* arrive.", "Ton yukulélé *pourrait* arriver."]]}, {"id": "44", "rule": "Interdire peut se faire avec _Don't_ (sans sujet) + base verbale ou bien No + verbe en -ing.", "ex": [["*Don’t* worry!", "*Ne* vous inquiétez *pas* !"], ["*No talking*!", "*Pas de bavardages* !"], ["*Don't* film the concert!", "*Ne* filmez *pas* le concert ! (avec don't)"], ["*No filming* the concert!", "*Ne* filmez *pas* le concert ! (avec no)"]]}, {"id": "45", "rule": "Comparer des choses : 'moins de' se dit _less_ + singulier ou bien _fewer_ + pluriel", "ex": [["I have *less* work this year.", "J'ai *moins de* travail cette année."], ["I have *fewer* lectures this year.", "J'ai *moins de* cours cette année."], ["We have *fewer* differences.", "Nous avons *moins de* différences."], ["The film has *less* action.", "Le film a *moins d'*action."]]}, {"id": "46", "rule": "Les noms communs sont ni masculin ni féminin donc il n'y a pas la différence 'le' et 'la' ou 'un' et 'une'.", "ex": [["*the* map, *the* supermarket", "*la* carte, *le* supermarché"], ["*a* form, *an* egg", "*un* formulaire, *un* œuf"], ["*a* television, *a* CD, *a* film, *a* table", "*une* télévision, *un* CD, *un* film, *une* table"], ["*the* bracelet, *the* page, *the* lion", "*le* bracelet, *la* page, *le* lion"]]}, {"id": "47", "rule": "Il n'y a pas de distinction entre 'tu et 'vous' : 'tu' singulier, 'vous' pluriel,  tutoiement, vouvoiement = _you_.", "ex": [["What are *you* studying?", "Qu'est-ce que *tu* étudies ?"], ["What are *you* studying?", "Qu'est-ce que *vous* étudiez ?"], ["Who are *you*?", "Qui es-*tu* ?"], ["How are *you*?", "Qui êtes *vous* ?"]]}, {"id": "48", "rule": "Il n'y a pas de distinction masculin/féminin pour la 3ème personne du pluriel : ‘ils/elles’ = _they_ ;  elles/eux = _them_ ; 'à elles/à eux = _theirs_.", "ex": [["*They’re* having a house-party tomorrow.", "*Ils* organisent une fête chez eux demain."], ["*They’re* having a house-party tomorrow.", "*Elles* organisent une fête chez elles demain."], ["*They* film.", "*Ils* filment."], ["*They* film.", "*Elles* filment."]]}, {"id": "49", "rule": "Pour traduire 'de, de la, du, des', on emploie _some_ quand on s’attend à une réponse positive et _any_ ou (rien) quand on ne s’attend à rien de particulier.", "ex": [["Do you take *milk* in your coffee?", "Tu prends *du lait* dans ton café ?"], ["Would you like *some* sugar?", "Aimeriez-vous *du sucre*?"]]}, {"id": "50", "rule": "Quand on veut mettre une emphase sur un verbe, on peut insérer l'auxiliaire _do_ juste avant (tant que le verbe n'est pas 'être' _be_).", "ex": [["I *do* like your dress.", "J'aime *vraiment* ta robe."], ["He *does* speak rather loud.", "Il parle plutôt fort *(j'en conviens)*."], ["I *do* like your t-shirt.", "J'aime *(vraiment)* ton t-shirt."], ["I *did* invite your parents.", "*Si*, j'ai invité tes parents."]]}, {"id": "51", "rule": "'depuis' se traduit par _for_ quand il suivi d'une durée de l'action, et par _since_ suivi 'une date ou d'un moment.", "ex": [["I have been in England *for* two months.", "Je suis en Angleterre *depuis* deux mois."], ["I have been in England *since* 2020.", "Je suis en Angleterre *depuis* 2020."], ["*For* six minutes.", "*Depuis* six minutes."], ["*Since* the meeting.", "*Depuis* le meeting."]]}, {"id": "52", "rule": "'faire' se traduit par _make_ quand on exprime une idée de fabrication, de création ; lorsqu'il signifie 'agir', 'accomplir', on utilise _do_. Et c'est _be_ pour la météo.", "ex": [["I'll *make* a cake this afternoon.", "Je *ferai* un gâteau cet après-midi."], ["I’ll *do* the dishes this afternoon.", "Je *ferai* la vaisselle cet après-midi."], ["My assistant *makes* the costumes.", "Mon assistant *fait* les costumes."], ["My assistant *does* the shopping.", "Mon assistant *fait* le shopping."], ["The weather *is* nice.", "Il *fait* beau."]]}, {"id": "53", "rule": "'regarder' quelque chose se dit _look at_ et regarder une action en déroulement se dit _watch_.", "ex": [["You *watch* films.", "Tu *regardes* des films."], ["You *look at* the document.", "Tu *regardes* le document."], ["We *watched* a film.", "On *a regardé* un film."], ["We *looked at* the pictures.", "Nous *avons regardé* les photos."]]}, {"id": "54", "rule": "Dans une phrase à deux verbes lexicaux (V1+V2), certains V1 obligent V2 à avoir sa forme basique, V (sans _-ing_ ni _to_).", "ex": [["*Could* you *repeat*?", "*Pourrais*-tu *répéter* ?"], ["*Can* you *show* me on the map?", "*Pouvez*-vous me *montrer* sur la carte ?"], ["*Help* me *decide*!", "*Aide*-moi à *décider* !"], ["You *can continue*.", "Tu *peux continuer*."]]}, {"id": "55", "rule": "Dans une phrase à deux verbes lexicaux (V1+V2), certains V1 permettent que V2  ait une forme _to_ + V ou _Ving_.", "ex": [["I *like to explore*.", "J'*aime explorer*."], ["I *like exploring*.", "J'*aime explorer*."]]}, {"id": "56", "rule": "Dans une phrase à deux verbes lexicaux (V1+V2), certains V1 obligent V2 à avoir sa forme _Ving_.", "ex": [["We *spent our time visiting*.", "Nous *avons passé notre temps à visiter*."], ["I don’t really *enjoy clubbing*.", "Je *n'aime pas trop sortir en boîte*."], ["They have *started arriving*.", "Ils *ont commencé à arriver*."], ["I *suggest changing* the date.", "Je *suggère de changer* la date."]]}, {"id": "57", "rule": "Dans une phrase à deux verbes lexicaux (V1+V2), certains V1 obligent V2 à avoir sa forme _to_ + V-ing.", "ex": [["I*'m used to taking* my bike.", "J'*ai l'habitude de prendre* mon vélo."], ["I*'m looking forward to visiting* you.", "J'*ai hâte de te rendre visite*."], ["I *look forward to arriving*.", "Je *me réjouis à l'idée d'arriver*."], ["I *admit to having contacted* the police.", "J'*admets avoir contacté* la police."]]}, {"id": "58", "rule": "'aussi' : _also_ se place avant le verbe conjugué, _too_ se place en fin de phrase.", "ex": [["I'm in a hurry *too*.", "Je suis pressé *aussi*."], ["I'm *also* in hurry.", "Je suis pressé *aussi*."], ["I *also* prepared a pizza.", "J'ai *aussi* préparé une pizza."], ["I prepared a pizza *too*.", "J'ai *aussi* préparé une pizza."]]}, {"id": "59", "rule": "Certains verbes sont suivis d'une préposition pour introduire leur complément (ce sont des transitifs indirects) alors qu'en français, le verbe équivalent ne sont pas suivis d'une préposition (ce sont des transitifs directs). L'inverse est vrai aussi.", "ex": [["Look *at* them!", "Regarde-les!"], ["We need a guitar.", "On a besoin *d'*une guitare."], ["Listen *to* me!", "Ecoute-moi !"], ["I obey my parents.", "J'obéis *à* mes parents."]]}, {"id": "60", "rule": "Au présent, 'avoir' peut se dire de deux manières : _have got_ ou bien _have_. Ce dernier ne se contracte généralement pas s'il est le seul verbe de la phrase.", "ex": [["I *have* a question. = I *have got* a question.", "*J'ai* une question."], ["Do you *have* Wifi? = *Have* you *got* Wifi?", "*Vous avez* du Wifi ?"], ["*Did* you *have* a map of the town?", "*Aviez-vous* une carte de la ville ?"], ["I *have got* a question.", "*J'ai* une question."]]}, {"id": "61", "rule": "'maison' se traduit par _house_ pour un pavillon et par _home_ quand il s'agit du foyer, du 'chez-moi' (qui peut être dans un appartement).", "ex": [["My *house* is in a village.", "Ma *maison* est dans un village."], ["I don't want a *house*.", "Je ne veux pas de *maison*."], ["I'm going back *home*.", "Je rentre *chez moi*."], ["His taxi is his *home*.", "Son taxi est sa *maison*."]]}, {"id": "62", "rule": "porter' se dit _wear_ quand c'est porter un vêtement sur soi et _carry_ quand c'est porter quelquechose à la main.", "ex": [["I *wear* t-shirts.", "Je *porte* des t-shirts."], ["I *carry* two bags.", "Je *porte* deux sacs."], ["Why are you not *wearing* your new jacket ?", "Pourquoi ne *portes*-tu pas ta nouvelle veste ?"], ["Would you like me to *carry* your bag?", "Est-ce que vous voulez que je vous *porte* votre sac ?"]]}, {"id": "63", "rule": "Pour la météo, 'faire' se traduit par le verbe 'être' _be_.", "ex": [["*It’s* cold tonight, isn’t it?", "*Il fait* froid ce soir, non ?"], ["The weather *is* nice today.", "*Il fait* beau aujourd'hui."], ["*It's* hot today.", "*Il fait* chaud aujourd'hui."], ["*It's* cloudy.", "*Il fait* gris."]]}, {"id": "64", "rule": "Dans les questions et les relatives, les prépositions se retrouvent le plus souvent à la fin.", "ex": [["Where are you *from*?", "Tu *viens d'*où ?"], ["What are you thinking *about*?", "*À quoi* tu penses ?"], ["What did you decide *on*?", "*Qu'*avez-vous décidé?"]]}, {"id": "65", "rule": "'n'est-ce pas?', 'hein?', 'non?', 'pas vrai?', 'c'est ça?' se traduisent par les \"question tags\" qui sont des reprises auxiliaire-pronom. Très utilisées en Grande-Bretagne. Le \"question tag\" est affirmatif si la phrase principale est négative ; il est négatif si la phrase principale est affirmative.", "ex": [["It’s cold tonight, *isn’t it*?", "Il fait froid ce soir, *non* ?"], ["You're open, *aren't you*?", "Vous êtes ouverts, *n'est-ce pas* ?"], ["Their restaurant is cool, *isn't it*?", "Leur restaurant est cool, *n'est-ce pas* ?"], ["You haven't decided, *have you*?", "Tu n'as pas décidé, *hein* ?"]]}, {"id": "66", "rule": "Pour dire la date : devant un jour de la semaine, on ne met pas le = _the_ . Soit on met (rien), soit on met _on_.", "ex": [["*Monday*", "*le lundi*"], ["*on Saturday*", "*le samedi*"], ["It's *Saturday*.", "C'est *le samedi*."], ["Come to mass *on Sunday*!", "Viens à la messe *dimanche* !"]]}, {"id": "67", "rule": "Pour exprimer le pouvoir ou l'influence d'une personne sur une autre, on a \"_make_ someone + _vb_\" ou \"_had_/_got_ someone _to_ + _vb_\".", "ex": [["You *make me* feel like dancing", "Tu *me donnes* envie de danser."], ["Studying *makes me* hungry.", "Etudier *me donne* faim."]]}, {"id": "68", "rule": "Le passé continu se forme avec auxiliaire 'être' conjugué au simple _past was_/_were_ + verbe en _-ing_ et sert à donner le contexte d'une action passée. Pourrait-on ajouter 'en train de' sans que cela change le sens de la phrase? Si oui : passé continu ; si non : _simple past_.", "ex": [["It *was raining*.", "Il *pleuvait*."], ["We *were waiting* for the flight when he phoned.", "On *attendait* le vol quand il a appelé."], ["The guide arrived as we *were filming* the tennis.", "Le guide arriva tandis que nous *filmions* le tennis."], ["I *was preparing* an omelette when the police telephoned.", "J'*étais en train de préparer* une omelette quand la police a téléphoné."]]}, {"id": "69", "rule": "Pour une reprise, on peut utiliser une structures avec 'verbe + préposition de reprise': verbe + _so_ / _to_.", "ex": [["Do you want to come? - I'd love *to*!", "Tu veux venir ? - J'adorerais !"], ["Do you think she'll come? - I don't think *so*.", "Tu crois qu'elle viendra? - Je ne crois pas."], ["Yes, I decided *to*.", "Oui, j'*en* ai décidé *ainsi*."], ["Don't present the instructions *so*!", "Ne présente pas les instructions *ainsi* !"]]}, {"id": "70", "rule": "'il y a' Quand on décrit ce qui est là, on utilise la structure '_there is_ / _there are'_ ; le verbe 'être' se conjugue avec ce qui vient après (une seule chose = _is_ / plusieurs choses = _are_) et seulement ce qui est juste après (accord de proximité).", "ex": [["*There is* a match.", "*Il y a* un match."], ["*There are* museums.", "*Il y a* des musés."], ["*Is there* any tooth-paste?", "Est-ce qu'*il y a* du dentifrice ?"], ["*There is* a cat and two dogs in the house.", "*Il y a* un chat et deux chiens dans la maison."]]}, {"id": "71", "rule": "'les deux' peut se dire _both_ et 'tous les deux', _both of us_", "ex": [["We *both* like it. = *Both* of us like it.", "On aime cela *tous les deux*."], ["I'll take *both*.", "Je prendrai *les deux*."]]}, {"id": "72", "rule": "A l'impératif (ordre, consigne, conseil), le verbe ne se conjugue pas.", "ex": [["*Wait*!", "*Attendez* ! / *Attends*!"], ["*Get* up!", "*Lève-toi*! / *Levez-vous* !"], ["*Excuse* me!", "*Excuse*-moi !"], ["*Excuse* me!", "*Excusez*-moi !"]]}, {"id": "73", "rule": "Pour l'impératif à la première personne (nous), on emploie _Let's_ avant le verbe.", "ex": [["*Let's wait* five minutes!", "*Attendons* cinq minutes !"], ["*Let's go*!", "*Allons*-y!"], ["*Let's prepare* sushi!", "*Préparons* des sushis !"], ["*Let's be* different!", "*Soyons* différents !"]]}, {"id": "74", "rule": "Les nombres : _hundred_ (cent) et _thousand_ (mille),…etc. sont invariables, lorsqu’ils sont précédés d’un nombre ou de a few ou several (quelques).", "ex": [["Eight *hundred* pupils.", "Huit *cents* élèves"], ["The village has *hundreds* of inhabitants.", "Le village a des *centaines* d'habitants."], ["two *thousand* years", "deux *milliers* d'années"], ["Six *hundred* euros.", "Six *cents* euros."]]}, {"id": "75", "rule": "Certains mots peuvent être contractés : on remplace des lettres par une apostrophe et on les colle au mot précédent. On ne peut pas contracter plusieurs mots d'un même groupe à la fois.", "ex": [["I am late = *I’m* late.", "Je suis en retard. = *J'chuis* en retard."], ["You are welcome. = *You're* welcome.", "Je t'en prie. = *Ch't'en prie*."], ["I am pale. = *I'm* pale", "*Je suis* pâle. = *Ch'suis* pâle."], ["I do not decide. = *I don't* decide.", "Je ne décide pas. = *J'*décide *pas*."]]}, {"id": "76", "rule": "Pour un nom de pays, ‘le/la’ se traduit par (rien), sauf s’il inclut un nom commun du type _states, kingdom, republic._", "ex": [["*England* is a beautiful country.", "*L'Angleterre* est un beau pays."], ["*France* is excellent at rugby.", "*La France* est excellente au rugby."], ["I'm from *the United Kingdom*.", "Je viens *du Royaume-Uni*."], ["*The USA* is very different.", "*Les États-Unis* sont très différents."]]}, {"id": "77", "rule": "L’adjectif ne s’accorde pas, ni en genre (masculin/féminin), ni en nombre (singulier/pluriel) : il est invariable. Et, surtout, l’adjectif se place avant le nom, pas après, sauf si on met une virgule ou une relative.", "ex": [["*special* instructions", "instructions *spéciales*"], ["*national* costumes", "costumes *nationaux*"], ["*part-time* jobs", "jobs *à mi-temps*"], ["Do you know *good* *cheap* restaurants?", "Connaissez-vous de *bons* restaurants *pas chers* ?"]]}, {"id": "78", "rule": "Le présent continu se forme avec l'auxiliaire 'être' _be_ conjugué au présent _be_ + verbe en -ing et s'emploie pour une action en cours dans le présent. Si insérer \"en train de\" dans la traduction française ne change pas le sens, c'est la forme continue (_BE_ + -ing) qu'on emploie. Sinon, c'est le présent simple.", "ex": [["The bus *is arriving*.", "Le bus *arrive*. (en train de)"], ["The bus *arrives* at 6 am.", "Le bus *arrive* à 6 heures. (d'habitude)"], ["What *are you doing*?", "Qu'est-ce que tu *es en train de faire* ?"], ["*I'm looking* for somewhere to pray.", "*Je cherche* un endroit où prier."]]}, {"id": "79", "rule": "'qui/que', pronom relatif : (rien), _who_, _which_, _that_. Pour les humains, on préfère _who_ ; _which_ pour les non-humains.", "ex": [["the guide *who* presents the village", "le guide *qui* présente le village"], ["the site *which* presents the village", "le site *qui* présente le village"], ["Is that Ellie *who* plays volleyball?", "Est-ce que c'est Ellie *qui* joue au volleyball ?"], ["Is that the bus *which* goes to the town-center?", "Est-ce le bus *qui* va au centre-ville ?"]]}, {"id": "80", "rule": "Choix present perfect ou simple _past_: quels autres mots ? _For_, _since_, _already_, _ever_, _never_, _not yet_ = present perfect (continu). Circonstanciels passés = _simple past_.", "ex": [["I *have been* in England *for* two months.", "*Ca fait deux mois que je suis* en Angleterre."], ["I *was* in England *last year*.", "*J'étais* en Angleterre *l'année dernière*."], ["I *haven't decided yet*.", "Je *n'ai pas décidé encore*."], ["*Since* the meeting, I *have continued* the article.", "*Depuis* le meeting, *j'ai continué* l'article."]]}, {"id": "81", "rule": "Dans certaines expressions, on ne traduit pas le 'se' de 'se + verbe'. Autrement dit, ces verbes ne sont pas  reflexifs en anglais.", "ex": [["They washed.", "Ils *se* sont lavés."], ["My manager is called Gwen.", "Ma chef *s'*appelle Gwen."], ["Where could I wash my hands?", "Où pourrais-je *me* laver les mains ?"]]}, {"id": "82", "rule": "Négation d'une seule chose qu'on pourrait compter, on traduit ‘de’ par a/an.", "ex": [["I don't want *a* house.", "Je ne veux pas *de* maison."], ["My gym doesn't have *a* pool.", "Ma salle de sport n'a pas *de* piscine."], ["The guide hasn't got *a* costume.", "Le guide n'a pas *de* costume."], ["I haven't got *a* telephone.", "Je n'ai pas *de* téléphone."]]}, {"id": "83", "rule": "'je devrais' se traduit par le modal _I should_ ou, plus rarement, par le modal _ought to_ (pas avec _must_).", "ex": [["I *should* graduate next year.", "Je *devrais* avoir mon diplôme l'année prochaine."], ["I *ought to* graduate next year.", "Je *devrais* avoir mon diplôme l'année prochaine."], ["I *should* continue.", "Je *devrais* continuer."], ["I *ought to* continue.", "Je *devrais* continuer."]]}, {"id": "84", "rule": "Dans une question indirecte, l'ordre est sujet + verbe. Il n'y a pas d'inversion sujet-'être' ou sujet auxiliaire, pas _do_ ajouté.", "ex": [["Ellie is asking *where it is*.", "Ellie demande *où c'est*."], ["I wonder *what it means*.", "Je me demande *ce que cela veut dire*."], ["She is asking *where the zoo is*.", "Elle demande *où est le zoo*."], ["He wonders *when the match is*.", "Il se demande *quand est le match*."]]}, {"id": "85", "rule": "Modalité au passé :  'j'ai pu' se traduit par _I was able to_ (capacité) ou _I was allowed to_ (permission). Le passé de _can_ (_could_) n'est pas utilisable pour quelque chose de ponctuel.", "ex": [["We *were allowed to* go in.", "On *a pu* entrer. (autorisation)."], ["I *wasn't able to* carry it.", "Je *n'ai pas pu* le porter."], ["I *was able to* explore the port.", "J'*ai pu* explorer le port."], ["I *was allowed to* explore the port.", "J'*ai été autorisé à* visiter le port."]]}, {"id": "86", "rule": "Quand on répond à une question fermée (oui/non), on utilise très souvent une reprise pronom-auxiliaire, avec le même verbe auxiliaire que dans la question.", "ex": [["Are you from Canada? - Yes, *I am*.", "Es-tu du Canada? - Oui."], ["Do you like your new flat? - Yes, *I do*.", "Aimes-tu ton nouvel appartement ? - Oui."], ["Does he camp? - No, *he doesn't*.", "Campe-t-il ? - Non."], ["Does the dragon protect the village? Yes, it does.", "Est-ce que le dragon protège le village ? Oui."], ["Is it a vegetarian dragon, then? - Yes, *it is*.", "Est-ce un dragon végetarien, alors ? - Oui."]]}, {"id": "87", "rule": "Quand un nom est traité comme dénombrable et comme indénombrable, il y a souvent une différence entre les deux sens.", "ex": [["She has brown *hair*.", "Elle a *les cheveux* bruns."], ["There's *a hair* on my lasagna.", "Il y a *un poil* sur mes lasagnes."]]}, {"id": "88", "rule": "Pour les noms de rues, de bâtiments, de parcs, de lacs, ‘le/la’ se traduit par (rien).", "ex": [["I saw Mount Everest and Lake Tilicho.", "J'ai vu *le* mont Everest et *le* lac Tilicho."], ["I camped on Mount Rushmore.", "J'ai campé sur *le* Mont Rushmore."], ["I swam in Lake Michigan.", "J'ai nagé dans *le* Lac Michigan."]]}, {"id": "89", "rule": "Certains verbes sont composés d'un verbe et d'une particule. Le sens du verbe est souvent modifié par la particule.", "ex": [["What are you *looking for*?", "Que *cherchez*-vous ?"], ["*Watch out*!", "*Prends garde* !"], ["*Come on*!", "*Allez* !"], ["The manager *passed out*.", "Le manager *s'est évanoui*."], ["*come from*; *come up with*; *come out*", "*venir de* ; *avoir une idée* ; *se déclarer*"]]}, {"id": "90", "rule": "La particule peut être placée à un endroit ou à un autre, sauf si le complément est un pronom et dans ce cas-là, elle doit être après.", "ex": [["*Try on* the t-shirt !", "Essaye le t-shirt!"], ["*Try* the jacket *on*!", "Essaye la veste !"], ["*Try* it *on*!", "Essaye-le!"]]}, {"id": "91", "rule": "Quelques rares mots sont invariables (pas de changement entre le singulier et le pluriel).", "ex": [["a *series*, two *series*", "une *série*, deux *séries*"], ["one *sheep*, two *sheep*", "un *mouton*, deux *moutons*"], ["*advice*, *advice*", "un *conseil*, des *conseils*"]]}, {"id": "92", "rule": "'trop' se traduit par _too much_ si cela désigne un nom indénombrable ou une action (on le place après le verbe) ; par _too_ si cela désigne un adjectif ; _too many_ si c'est pour un nom dénombrable.", "ex": [["It's *too* simple.", "C'est *trop* simple."], ["You decide *too much*.", "Tu décides *trop*."], ["I have had *too much* wine.", "J'ai bu *trop de* vin."], ["I’m *too* drunk to drive.", "Je suis *trop* ivre pour conduire."]]}, {"id": "93", "rule": "'tout' se traduit par _all_ quand c'est un ensemble en bloc, par _whole_ pour dire 'en entier', par _any_ pour dire nimporte quel(le), par _every_ quand c'est un peu comme 'chaque'", "ex": [["*Any* cash point will do.", "*Nimporte quel* distributeur fera l'affaire"], ["*All* the cash-points are out of order.", "*Tous les* distributeurs sont hors-service."], ["*All* my cousins are invited.", "*Tous* mes cousins sont invités."], ["The *whole* restaurant is invited.", "*Tout* le restaurant est invité."]]}, {"id": "94", "rule": "'se + verbe' se traduit par verbe + pronom réfléchi quand le pronom renvoie à la personne déjà mentionnée.", "ex": [["Ellie is looking at *herself* in the mirror.", "Ellie *se* regarde dans le miroir."], ["When I find *myself* in times of trouble,", "Quand je *me* trouve dans des temps d'épreuve,"], ["She excused *herself*.", "Elle *s'*est excusée."], ["He invited *himself*.", "Il *s'*est invité."], ["The dragon admires *itself* in the mirror.", "Le dragon *se* regarde dans le miroir."]]}, {"id": "95", "rule": "'se + verbe' se traduit par verbe + l'un l'autre _love each other_ / _one another_ quand c'est l'idée de \"mutuellement\" qui est exprimée.", "ex": [["They congratulated *one another*.", "Ils *se* félicitèrent."], ["Neil and Tom like *each other*.", "Neil et Tom *s'*aiment bien."], ["They wash *each other*.", "Ils *se* lavent *(l'un l'autre)*."], ["They wash.", "Ils *se* lavent. *(eux-mêmes)*"]]}, {"id": "96", "rule": "Quand on ne répète pas un nom commun parce que c'est évident, on ne peut pas laisser l'adjectif tout seul : il faut ajouter _one_(s) comme pronom.", "ex": [["Take the next *one* on the right!", "Prenez la prochaine à droite !"], ["I don't like the blue *one*.", "Je n'aime pas la bleue."], ["I prefer the orange *one*.", "Je préfère le orange."], ["She prefers the special *ones*.", "Elle préfère les spéciaux."]]}, {"id": "97", "rule": "Les noms de pays au pluriel sont suivis d’un verbe au singulier.", "ex": [["*The USA is* a big country.", "*Les Etats-Unis sont* un grand pays."], ["*The United States is* a puzzle.", "*Les Etats-Unis sont* un puzzle."]]}, {"id": "98", "rule": "Quand on emploie le conditionnel en français pour dire 'il semble que / on dit que', on ne traduit pas par _would_.", "ex": [["He *is said to be* married", "Il *serait* marié."], ["He is married, *apparently*.", "Il *serait* marié."], ["He *is rumoured to be* the next president.", "Il *serait* le prochain président."], ["She *is said to be* strict.", "Elle *serait* stricte."]]}, {"id": "99", "rule": "Le present perfect s'emploie quand on parle de quelque chose qui vient juste de se passer : _have_ / _has just_ + participe passé.", "ex": [["*I’ve just* arrived.", "Je *viens d'*arriver."], ["*He's just* called.", "Il *vient d'*appeler."], ["We *have just* arrived at the restaurant.", "On *vient juste d'*arriver au restaurant."], ["He *has just* paid.", "Il *vient de* payer."]]}, {"id": "100", "rule": "'déjà' Quand il pourrait être remplacé par 'jamais', on peut le traduire par _ever_ ; sinon, on le traduit par _already_.", "ex": [["Have you *already* had lunch?", "As-tu *déjà* déjeuné?"], ["Have you *ever* had lunch at the Thaï restaurant?", "As-tu *déjà* déjeuné au restaurant Thaï ?"], ["Have you *ever* skied?", "As-tu *déjà* skié ? (dans ta vie)"], ["I have *already* skied.", "J'ai *déjà* skié."], ["The prince has *never* explored the jungle. Has the champion *ever* explored the jungle?", "Le prince n'a *jamais* exploré la jungle. Le champion a-t-il *déjà* exploré la jungle ?"]]}, {"id": "101", "rule": "'jamais' Quand on veut dire 'à aucun moment', c'est _never_ ; quand on veut dire 'à nimporte quel moment'/'déjà', c'est _ever_.", "ex": [["No, she's *never* sad.", "Non, elle n'est *jamais* triste."], ["Is she *ever* sad?", "Est-elle *jamais* triste ?"], ["Have you *ever* visited a zoo ?", "As-tu *déjà* visité un zoo ?"], ["I have *never* visited a zoo.", "Je n'ai *jamais* visité un zoo."]]}, {"id": "102", "rule": "Le present perfect continu se forme avec l'auxiliaire 'avoir' _have_ conjugué + _been_ + verbe en -ing et s'emploie pour mettre en valeur la continuité entre passé et présent.", "ex": [["*I’ve been saving* my wages.", "J'*économise* mon salaire *depuis un certain temps*."], ["How long *have you been living* in London?", "*Ca fait combien de temps que tu habites* à Londres ?"], ["The magazine *has been preparing* an article on opera.", "Le magazine *prépare* un article sur l'opéra *(depuis un certain temps)*."], ["I *have been filming* the village for the site.", "J'*ai filmé* le village pour le site."]]}, {"id": "103", "rule": "Quand on exprime une habitude passée, on peut employer _would_ + base verbale. On ne l'emploie pas autant que l'imparfait ; on recourra donc fréquemmment au _simple past_.", "ex": [["We *would cycle* to school.", "Nous *allions* à l'école à vélo."], ["He *would* always *start* by the end.", "Il *commençait* toujours par la fin."], ["We *would camp* in the desert.", "Nous *campions* dans le désert."], ["He *would arrive* on a scooter.", "Il *arrivait* sur un scooter. (souvenir)"]]}, {"id": "104", "rule": "'ne…plus' se dit _not_... _any more_ ou, quand il s'agit de quelque chose qui n'est plus vrai, on peut utiliser _no longer_ ou _not_... _any longer_.", "ex": [["We don't train with him *anymore*.", "On *ne* s'entraîne *plus* avec lui."], ["We *no longer* train with him.", "On *ne* s'entraîne *plus* avec lui."], ["I don't film the baseball *anymore*.", "Je *ne* filme *plus* le baseball."], ["I *no longer* film the baseball.", "Je *ne* filme *plus* le baseball."]]}, {"id": "105", "rule": "'on' se traduit souvent par le passif et pour les verbes d'opinion, et on a le choix entre deux ordres de mots.", "ex": [["I *was asked* to leave.", "On *m'a demandé* de partir."], ["We *are invited*.", "*On nous invite*."], ["I *was contacted*.", "*On m'a contactée*."], ["*She is thought to be* the best.", "*On pense d'elle que c'est* la meilleure."]]}, {"id": "106", "rule": "Le conditionnel se traduit très souvent par _would_ / 'd + base verbale, et quelques modaux se transforment : _can_ --> _could_ ; _shall_ --> _should_.", "ex": [["What *would* you like?", "Qu'*aimeriez*-vous ?"], ["*Could* you speak slower?", "*Pourriez-vous* parler plus lentement ?"], ["If I had a moment, I *would* continue.", "Si j'avais un moment, je *continuerais*."], ["*Would* you excuse me?", "*Voudriez-vous* m'excuser?"]]}, {"id": "107", "rule": "Les équivalents de modaux : _be able to_ est l'équivalent de _can_ quand ce dernier exprime 'avoir le pouvoir, avoir la capacité' ; _have to_ est l'équivalent de  _must_ dans le sens 'devoir, être obligé' ; tandis que _be allowed to_ est l'équivalente de _may_ dans le sens 'avoir la permission'.", "ex": [["I *had to* see my tutor.", "J'*ai dû* voir mon tuteur."], ["I *must have* seen my tutor.", "J'ai *(probablement) dû* voir mon tuteur."], ["We *are able* and *allowed to* explore the desert.", "Nous *sommes capables de* et *autorisés à* explorer le désert."], ["I *have to* invite my parents.", "Je *suis obligée d'*inviter mes parents."]]}, {"id": "108", "rule": "'tu n'es pas obligé' se traduit par _you don't have to_. C'est la négation de l'obligation, plutôt que \"l'obligation de ne pas\" exprimée par _you mustn't_ / _you shouldn't_.", "ex": [["You *don't have to* go.", "Tu *n'es pas obligé d'*y aller."], ["You *shouldn't* go.", "Tu *ne devrais pas* y aller."], ["You *don't have to* decide.", "Tu *n'es pas obligé de* décider."], ["You *mustn't* decide.", "Tu *ne dois pas* décider."]]}, {"id": "109", "rule": "Modalité au passé :  'j'ai dû' (obligation) se traduit par _I had to_. 'Devoir' _must_ n'est utilisable au passé que pour une très forte probabilité, du type 'j'ai dû l'oublier'.", "ex": [["I *must have* met him.", "J'*ai dû* le rencontrer (probabilité passée forte)."], ["He *had to* leave.", "Il *a dû* partir."], ["I *had to* change my ticket.", "J'*ai dû* changer mon ticket. (passé)"], ["He *must have* prepared a sandwich.", "Il *a dû* préparer un sandwich. (probabilité)"]]}, {"id": "110", "rule": "Les modaux ne peuvent pas être employés après _to_, ni au futur alors on utilise leurs équivalents.", "ex": [["We'll *have to* go shopping soon.", "Il *va falloir qu'*on fasse des courses bientôt."], ["I hope to *be able to* go on holiday soon.", "J'espère *pouvoir* partir en vacances bientôt."], ["I want to *be able to* film.", "Je veux *pouvoir* filmer."], ["We will *have to* camp.", "Nous allons *devoir* camper."]]}, {"id": "111", "rule": "Comparer des choses : l'ajout d'un suffixe change l'orthographe de l'adjectif court.", "ex": [["September is *sunnier* than October.", "Septembre est *plus ensoleillé qu'*octobre."], ["It's *hotter* today.", "Il fait *plus chaud* aujourd'hui."], ["The clown is *bigger* and *funnier*.", "Le clown est *plus grand* et *plus drôle*."], ["The fan is *fatter* and *happier*.", "Le fan est *plus gros* et *plus heureux*."]]}, {"id": "112", "rule": "On traduit le 'si/tellement' exclamatif de deux façons : 'si' + adjectif/adverbe : _so_ ; 'si' + nom : _such_", "ex": [["It's *such* a cold night !", "C'est une nuit *si* froide !"], ["It's *so* cold this evening.", "Il fait *si* froid ce soir."], ["It's *so* simple!", "C'est *tellement* simple !"], ["I've never prepared *such* a simple sandwich.", "Je n'ai jamais préparé un sandwich *aussi* simple."]]}, {"id": "113", "rule": "Quand on s'exclame sur des choses avec _such_ (=si/tellement), il est en tête de groupe nominal. On n'oublie pas : l'adjectif avant le nom, pas d'articles pour les généralités.", "ex": [["They're *such* old houses !", "Ce sont de *si* vieilles maisons !"], ["You have *such* big teeth.", "Tu as de *si* grandes dents."], ["Why *such* horrible operas?", "Pourquoi des opéras *si* horribles?"], ["*What* large snowboards!", "*Quels* larges snowboards !"]]}, {"id": "114", "rule": "Génitif : il n'y a même pas besoin d'ajouter le deuxième nom lorsqu'il est évident, d'après le contexte. C'est pour ça que 'chez'… = _at…'s_.", "ex": [["It's my *friend's*.", "C'est *celle de mon ami*."], ["It's my *cousin's*.", "C'est *à mon cousin*."], ["I am at *the dentist's*.", "Je suis *chez le dentiste*."]]}, {"id": "115", "rule": "La date [version UK] : Pour la date, à l'oral (mais pas obligatoirement à l'écrit), on met l’article défini 'le' _the_ avant le jour et 'de' _of_ avant le mois.", "ex": [["Thursday *the* 3rd *of* October.", "le jeudi 3 octobre (UK)."], ["Friday *the* 1st *of* February", "vendredi 1er février"], ["Saturday *the* 6th *of* May", "samedi 6 mai (UK)"], ["Monday *the* 4th *of* May", "lundi 4 mai (UK)"]]}, {"id": "116", "rule": "L'heure [manière moderne] : l'ordre des mots est heures + minutes (+ _am_/_pm_), comme en français mais sans traduction de \"heure\". _am_ ou _pm_ précise le moment de la journée.", "ex": [["From *8.30*  to *9.15 am*.", "De 8h30 à 9h15 le matin."], ["*Seven am* or *pm*?", "Sept heures ou dix-neuf heures ?"], ["*six fifteen am*", "six heures quinze (moderne)"], ["*six fifteen pm*", "dix-huit heures quinze (moderne)"], ["The festival starts at *seven thirty pm*.", "Le festival commence à sept heures trente du soir."]]}, {"id": "117", "rule": "L'heure [manière traditionnelle] : l'ordre des mots est minutes + _past_/_to_ 'après/avant' + heures (+ moment de la journée mais pas en forme _am_/_pm_). On peut employer  les termes _quarter_ 'quarts' et _half_ 'demies', et _o'clock_ (pour les heures piles).", "ex": [["From *half past 8* to *quarter past 9* in the morning.", "De *8h30* à *9h15* le matin."], ["It's *quarter to five* in the afternoon.", "Il est *seize heures quarante-cinq*."], ["*quarter past six* in the evening", "*dix-huit heures quinze* (traditionnelle)"], ["*half past six* in the evening", "*dix-huit heures trente*"]]}, {"id": "118", "rule": "_used to_ perd souvent son <d> dans les formes interrogatives et négatives.", "ex": [["I am not *used to* camping.", "Je *ne suis pas habitué à* camper."], ["Did uni always *use to* be like that?", "Est-ce que la fac a *toujours été* comme cela ?"], ["I didn't *use to* wake up early.", "Je *n'avais pas l'habitude de* me lever tôt."], ["Did you *use to*?", "Tu en *avais l'habitude*?"]]}, {"id": "119", "rule": "Le futur pour un projet officiel peut se traduire par _be_ conjugué + _to_ + base verbale.", "ex": [["The prince *is to* protect the village.", "Le prince *va* protéger le village."]]}, {"id": "120", "rule": "'être sur le point de' se traduit par _to be about to_.", "ex": [["The prince *is about to* protect the village.", "Le prince *est sur le point de* protéger le village."]]}, {"id": "121", "rule": "On peut former le passif avec _get + V_ au participe passé, particulièrement lorsque l'action est inattendue ou désagréable.", "ex": [["The village *got destroyed* by the dragon.", "Le village *s'est fait détruire* par le dragon."]]}, {"id": "122", "rule": "'se + verbe' dans un sens passif se traduit par le passif (avec _be_ ou _get_)", "ex": [["I *get* served quickly.", "Je *me fais* servir rapidement."]]}, {"id": "123", "rule": "Il y a des pronoms dont le sens général est \"quelqu'il soit\" : _whoever, whatever, whichever, whenever, wherever, however._", "ex": [["The prince will protect the village, *whatever* happens.", "Le prince protégera le village, *quoi qu'*il arrive."]]}, {"id": "124", "rule": "On peut parfois supprimer le pronom relatif ou la conjonction de subordination  'qui / que'  _that_.", "ex": [["I think you're great.", "Je pense *que* tu es super."]]}, {"id": "125", "rule": "Quand un _Ving _ est le centre d'une subordonnée, son sujet peut être un possessif (_my_, _your_,…), un génétif (_'s_) ou même un pronom complément (_me, you_…)", "ex": [["*The prince being absent*, the champion protects the village.", "*Le prince étant absent*, le champion protège le village."]]}, {"id": "126", "rule": "Dans une subordonnée commençant par  une conjonction de temps comme _when_, là où le français mettrait du futur antérieur, l'anglais utilise du _present perfect._", "ex": [["When the president *has decided*, he will speak to the media.", "Quand le président *aura décidé*, il parlera aux médias."]]}, {"id": "127", "rule": "‘être d’accord’ se dit en un mot : _agree_ et non en deux.", "ex": [["I *agree* with you.", "Je *suis d'accord* avec toi."], ["He always *agrees* with me.", "Il *est* toujours *d'accord* avec moi."], ["I *don't agree*.", "Je *ne suis pas d'accord*."]]}, {"id": "128", "rule": "On évite de disloquer les phrases et les sujets (en deux bouts séparés par une virgule) comme on fait à l'oral en français.", "ex": [["I'm Tom.", "*Moi, c'*est Tom."], ["The deadline is tomorrow.", "La date-limite*, c'*est demain."], ["An omelette is easy to make.", "Une omelette*, c'*est simple à faire."], ["Badminton is excellent.", "Le badminton*, c'*est excellent."]]}, {"id": "129", "rule": "'faire' ne se traduit pas dans certaines expressions comme faire du camping / faire du surf / faire du ski ou bien il se traduit par un autre verbe comme dans faire de la randonnée ou faire de l'asthme.", "ex": [["I ski.", "Je *fais* du ski."], ["We camp.", "On *fait* du camping."], ["I *have* asthma.", "Je *fais* de l'asthme."], ["In the summer, I like to *go* hiking.", "L'été, j'aime *faire* de la randonnée."]]}, {"id": "130", "rule": "Dans un style formel, lorsqu'une phrase commence par un adverbe négatif ou restrictif, l'ordre des mots est adverbe + auxiliaire + sujet.", "ex": [["*Never had* the prince seen such a gigantic dragon.", "*Jamais* le prince *n'avait* vu un dragon aussi gigantesque."]]}, {"id": "131", "rule": "'personne' se traduit par a _person_ (_people_ au pluriel).", "ex": [["She's a lovely *person*.", "C'est une *personne* adorable."], ["*People* know.", "*Les gens* savent."]]}, {"id": "132", "rule": "'il y a' Quand on parle d'une durée qui s'est passée, on utilise une structure avec _ago_ ; on met le temps écoulé d’abord et _ago_ après.", "ex": [["*Two months ago*.", "*Il y a deux mois*."], ["I arrived *a year ago*.", "Je suis arrivée *il y a un an*."], ["*Six seconds ago*.", "*Il y a six secondes*."], ["*A moment ago*.", "*Il y a un moment*."], ["The dragon destroyed the village *a hundred years ago*.", "Le dragon a détruit le village *il y a cent ans*."]]}, {"id": "133", "rule": "Pour l'âge, les sensations et la chance,  'avoir' se traduit par le verbe 'être' _be_.", "ex": [["*Are* you thirsty?", "*As*-tu soif ?"], ["*I’m* hungry.", "*J'ai* faim."], ["My parents *are* sixty.", "Mes parents *ont* soixante (ans)."], ["The clown *is* hungry.", "Le clown *a* faim."], ["The prince *is* 19 years old.", "Le prince *a* 19 ans."]]}, {"id": "134", "rule": "Un document écrit ne parle pas  car il n'a pas de bouche. Dans ce cas, quand c'est 'traiter de', 'parler' se traduit  _to be about_ ou _to_ deal _with_.", "ex": [["This text *is about* history.", "Ce texte *parle d'*histoire."], ["Her essay *deals with* Eurostar prices.", "Sa dissertation *parle des* prix de l'Eurostar."], ["The article *is about* the festival.", "L'article *parle du* festival."], ["The document *deals with* the impact of business on science.", "Le document *parle de l'*impact du business sur la science."]]}, {"id": "135", "rule": "'dire' se traduit par _tell_ ou _say_. Si la personne à qui on parle est mentionnée, il faut un _to_ après _say_ mais pas après _tell_. _Tell_ a le sens de raconter.", "ex": [["Your sister *told me* you were tired.", "Ta sœur *m'a dit que* tu étais fatigué."], ["Your sister *said* you were tired.", "Ta sœur *m'a dit que* tu étais fatigué."], ["I *said* \"zero\".", "J'ai *dit* \"zéro\"."], ["I *told* the police the details.", "J'ai *dit* les détails à la police."]]}, {"id": "136", "rule": "Quand on parle d'un état habituel passé ou qu'on veut mettre en valeur le fait que les choses ont changé, on emploie _used to_.", "ex": [["I *used to* cycle to school ; now I take the bus.", "J'*allais* à l'école à vélo ; maintenant, je prends le bus."], ["I *used to* be really lazy.", "*Avant*, j'étais vraiment paresseuse."], ["I *used to* have a restaurant.", "J'avais un restaurant *autrefois*."], ["The theater *used to* be special.", "Le théâtre était spécial *autrefois*."]]}, {"id": "137", "rule": "'ressembler, avoir l'air'  avoir l'air d', ressembler à : _to look like_. Se ressembler : _to look alike_. Avoir l'air : _to look_ / _to seem_.", "ex": [["You *look* normal.", "Tu *as l'air* normal."], ["You *look* lovely.", "Tu *as l'air* ravissante."], ["You *look like* your father.", "Tu *ressembles à* ton père."], ["You *look like* a lion.", "Tu *ressembles à* un lion."]]}, {"id": "138", "rule": "'aussi' peut se traduire de 5 manières différentes: par _also_ ou _too_ pour dire 'en plus', _as_ quand c'est dans une comparaison, _so_/_such_ dans une exclamation et _so_ quand on aurait pu mettre 'tellement' en français'", "ex": [["I didn't know he was *so* nice.", "Je ne savais pas qu'il était *aussi* sympa."], ["I didn't know he was nice *too*.", "Je ne savais pas qu'il était sympa *aussi*."], ["Me *too*: I *also* prepared a pizza.", "Moi *aussi*: j'ai *aussi* préparé une pizza."], ["I've never prepared *such* a simple sandwich.", "Je n'ai jamais préparé un sandwich *aussi* simple."]]}, {"id": "139", "rule": "'ce qui / ce que' se traduit le plus souvent par _what_.", "ex": [["I don't know *what* I want.", "Je ne sais pas *ce que* je veux."], ["*What* bothers me is the noise.", "*Ce qui* m'embête, c'est le bruit."], ["I film *what* I visit.", "Je filme *ce que* je visite."], ["We present *what* we prepare.", "Nous présentons *ce que* nous préparons."]]}, {"id": "140", "rule": "'L'un ou l'autre' se dit soit _one or the other_ soit, en un seul mot, _either_. 'Aucun des deux' se dit _neither_. 'Ni…ni' se dit soit _not_… _either_… _or_ soit _neither_… _nor_.", "ex": [["*Either* way will get you there.", "*L'un ou l'autre* des chemins vous y mènera."], ["*Neither* of us found it good.", "*Ni l'un ni l'autre*, nous ne l'avons trouvé bien."], ["I haven't visited *either* the port *or* the zoo. = I have visited *neither* the port *nor* the zoo.", "Je n'ai visité *ni* le port *ni* le zoo."], ["I visited *neither*.", "Je n'ai visité *aucun des deux*."]]}, {"id": "141", "rule": "Certains verbes à particule expriment un moyen (par le verbe) et un résultat (par une particule ou un adjectif).", "ex": [["She *ran through* the station.", "Elle *traversa* la gare *en courant*."], ["She *wiped* the table *clean*.", "Elle *nettoya* la table *en l'essuyant*."], ["He *talked his way out of* it.", "Il *s'*en *est sorti par des explications*."], ["The dragon *burned* the house *down*.", "Le dragon *a brûlé* la maison *jusqu'aux cendres*."]]}, {"id": "142", "rule": "Un verbe en -ing peut être le centre d'une proposition subordonnée et avoir son propre sujet.", "ex": [["I'm looking forward to *my friend visiting* me.", "J'ai hâte *que mon ami vienne* me rendre visite."], ["It's a book about *students studying* abroad.", "C'est un livre à propos *d'étudiants qui étudient* à l'étranger."], ["I hope you forgive *my being* silly.", "J'espère que tu pardonnes *ma bêtise*."]]}, {"id": "143", "rule": "Le plus que parfait se forme pareil en anglais qu'en français, avec l'auxilaire 'avoir' au passé _had_ + participe passé du verbe et sert à la même chose : le passé du passé.", "ex": [["I *had already walked* 2 miles when they started hurting.", "J'*avais déjà marché* 3 kilomètres quand ils ont commencé à me faire mal."], ["She *had spoken* to the driver already.", "Elle *avait déjà parlé* au chauffeur."], ["He *had arrived*.", "Il *était arrivé*."], ["I *had prepared* a pizza.", "J'*avais préparé* une pizza."]]}, {"id": "144", "rule": "Comparer des choses : 'autant de + nom que ' se dit as _much_/_many_ + nom + _as_ : 'que' se traduit par _as_ quand il y a égalité (par _than_ quand il y a inégalité).", "ex": [["I love my sister *as much as* my brother.", "J'aime ma sœur *autant que* mon frère."], ["I don't have *as many* books *as* you.", "Je n'ai pas *autant de* livres *que* toi."], ["I have *as many* tops *as* you.", "J'ai *autant de* tops *que* toi."], ["I have *as much* experience *as* you.", "J'ai *autant d'*expérience *que* toi."]]}, {"id": "145", "rule": "La date [version US] :  Pour la date, on inverse l'ordre numéro du jour et mois. Il y a une virgule entre le nom du jour et le nom du mois.", "ex": [["It’s Tursday, *October 3rd*.", "Le jeudi *3 octobre* (US)."], ["Friday, *February 1st*", "vendredi *1er février*"], ["Saturday, *May the 6th*", "samedi *6 mai* (US)"], ["Monday, *May the 4th*", "lundi *4 mai* (US)"]]}, {"id": "146", "rule": "L'heure : le mot 'heure' ne se traduit pas. _O'clock_ s'utilise pour les heures piles dans la manière traditionnelle.", "ex": [["It's one twenty-five", "Il est une *heure* vingt-cinq."], ["At seven.", "A sept *heures*."], ["six *o'clock* in the evening", "dix-huit heures (traditionnel)"], ["six *pm*", "dix-huit heures (moderne)"]]}, {"id": "147", "rule": "La structure '_feel like'+ Ving_ permet d'exprimer le désir.", "ex": [["I *feel like dancing*.", "J'*ai envie de danser*."], ["She doesn't *feel like going*.", "Elle n'*a* pas *envie d'y aller*."], ["What do you *feel like doing* tonight?", "Qu'*as-tu envie de faire* ce soir ?"], ["I *feel like going* for a picnic.", "J'*ai envie d'aller* pique-niquer."]]}, {"id": "148", "rule": "Pour faire une suggestion (du type 'Et si on…?'), on peut dire _Shall we_ + base verbale, ou _What about_ + verbe en -ing? / nom, ou _Why don't you_ + base verbale?           (_And if_ + [proposition] est impossible.)", "ex": [["*Shall we eat* out this evening?", "*On va au restaurant* ce soir ?"], ["*What about cycling* there?", "*Et si on y allait* à vélo ?"], ["*What about exploring* the hotel?", "*Et si on explorait* l'hôtel?"], ["*Shall we prepare* dessert?", "*On prépare* le dessert ?"]]}, {"id": "149", "rule": "'moi aussi', alternatives à \"Me _too_.\" : 1. _I do too_.  2. _So do I_.", "ex": [["I buy organic food. - *So do I*.", "J'achète de la nourriture bio. - *Moi aussi*."], ["I buy organic food. - *I do too*.", "J'achète de la nourriture bio. - *Moi aussi*."], ["I have a ticket! - *I do too*.", "J'ai un ticket ! - *Moi aussi*. (sans me too)"], ["I have a ticket! - *So do I*.", "J'ai un ticket ! - *Moi aussi*. (sans me too)"]]}, {"id": "150", "rule": "Comparer des choses : certains adjectifs ont une forme différente de comparatif et de superlatif.", "ex": [["*good* ; *better* ; *best*", "*bon* ; *meilleur* ; *le meilleur*"], ["*bad* ; *worse* ; *worst*", "*mauvais* ; *plus mauvais* ; *pire*"], ["I'm good; she's *better*.", "Je suis bon; elle est *meilleure*."], ["You're *the best*.", "Tu es *le meilleur*."]]}, {"id": "151", "rule": "Dactylographie : on ne met pas d'espace avant les points (points-virgules, points, points d'interrogation et d'exclamation).", "ex": [["Stairs or lift*?*", "Escaliers ou ascenseur *?*"], ["Wait*!*", "Attends *!*"], ["Me too*!*", "Moi aussi *!*"], ["A biscuit*?*", "Un biscuit *?*"], ["The prince is courageous*;* the champion is brave.", "Le prince est courageux *;* le champion est brave."]]}, {"id": "152", "rule": "Poser une question : il y a des structures qui commencent par _How_ + adjectif : _How old_... , _How_ tall... , _How far_…, _How_ long…, _How true_...", "ex": [["*How far* is the station?", "*A quelle distance* est la gare?"], ["*How true* is that story?", "*Quel est le degré de vérité de* cette histoire ?"], ["*How old* are you?", "*Quel âge* as-tu?"], ["*How far* is the zoo?", "*A quelle distance* est le zoo?"]]}, {"id": "153", "rule": "Pour parler d'une distance entre deux choses, l'ordre des mots est différent.", "ex": [["I am *six kilometres away*.", "Je suis *à six kilomètres*."], ["The theater is *six miles away*.", "Le théâtre est *à six miles*."], ["I live *ten minutes away from* uni.", "J'habite *à 10 minutes de* la fac."], ["Oxford is *55 miles away from* Central London.", "Oxford est *à 55 miles du* centre de Londres."]]}, {"id": "154", "rule": "Le plus que parfait continu, qui se forme avec l'auxiliaire 'avoir' au passé _had + been + Ving_, s'emploie pour parler d'une action en cours à un moment passé.", "ex": [["I *had been walking* for two hours when, suddenly, I saw the station.", "Je *marchais depuis deux heures* quand, soudain, j'ai vu la gare."], ["We *had been sleeping* for an hour when the alarm went off.", "On *dormait depuis une heure* quand l'alarme se mit en route."], ["My assistant *had been exploring* the question when we had the information.", "Mon assistant *explorait* la question *(depuis un certain temps)* quand on a eu l'information."], ["I *had been preparing* for days.", "Je *m'étais préparée pendant des jours*."]]}, {"id": "155", "rule": "Le futur avec le présent se traduit par le présent continu.", "ex": [["*They're having* a house-party tomorrow.", "*Ils organisent* une fête chez eux demain."], ["*I'm getting* off at the next stop.", "Je *descends* au prochain arrêt."], ["My assistant *is arriving* tomorrow.", "Mon assistant *arrive* demain."], ["The festival *is starting* on Sunday.", "Le festival *commence* dimanche."]]}, {"id": "156", "rule": "'préférer' au conditionnel se traduit par _would prefer_ suivi d'un verbe en _to_ ou _would rather_ suivi d'un verbe sans _to_.", "ex": [["I would *prefer to* camp.", "Je *préfèrerais* camper."], ["I would *rather* camp.", "Je *préfèrerais* camper."], ["I *would rather be* blind. = I*'d rather be* blind.", "Je *préfèrerais être* aveugle."], ["I *would prefer to* be blind. = I*'d prefer to* be blind.", "Je *préfèrerais être* aveugle."], ["No, I’d *rather* not.", "Non, je *préférerais* pas."]]}, {"id": "157", "rule": "'devoir' dans le sens 'il vaudrait mieux que…' se traduit par _'d better + V_.", "ex": [["*I'd better* prepare a dessert.", "Je *devrais* préparer un dessert. (il vaut mieux)"], ["I *should* prepare a dessert.", "Je *devrais* préparer un dessert. (ce serait bien)"], ["You*'d better* be quiet.", "Tu *ferais mieux de* te taire. (il vaut mieux)"], ["I *should* graduate next year.", "Je *devrais* avoir mon diplôme l'année prochaine. (c'est probable)"], ["I*'d better* graduate next year.", "*Il vaudrait mieux que* j'ai mon diplôme l'année prochaine."], ["You*'d better* contact the police.", "*Il vaudrait mieux que* tu contactes la police."]]}, {"id": "158", "rule": "Modalité au passé : les modaux ne peuvent pas être employés comme participe passé ou, dans certains cas, pour le passé, alors on utilise leurs équivalents.", "ex": [["Pupils *had to* wear shirts.", "Les élèves *devaient* porter des chemises."], ["I *was not able to* see my tutor.", "Je *n'ai pas pu* voir mon tuteur."], ["I *have had to* change my ticket.", "J'*ai dû* changer mon ticket. (present perfect)"], ["She *has been able to* complete the album.", "Elle *a pu* compléter l'album."]]}, {"id": "159", "rule": "Modalité au passé : l'ordre des mots est inverse: _must_/_may_/_could_/_might_ + _have_ + participe passé du verbe.", "ex": [["He *must have* left.", "Il *a dû* partir (probabilité passée)."], ["He *might have* left.", "Il *est peut-être parti*."], ["The taxi *might/could/may have* arrived.", "Le taxi *est peut-être arrivé*."]]}, {"id": "160", "rule": "Comparer des choses : 'de plus en plus ...' se dit _(adjectif)-er and (adjectif)er_ avec les adjectifs courts.", "ex": [["My flatmate is getting *weirder and weirder*.", "Mon colocataire devient *de plus en plus étrange*."], ["*Better and better*.", "*De mieux en mieux*."], ["Our telephones are *larger and larger*.", "Nos téléphones sont *de plus en plus larges*."], ["My videos are *longer and longer*.", "Mes vidéos sont *de plus en plus longues*."], ["The dragon is getting *bigger and bigger*.", "Le dragon devient *de plus en plus grand*."]]}, {"id": "161", "rule": "Génitif : quand le mot désignant la personne se termine par la lettre -s, on peut relier les deux en mettant juste une apostrophe.", "ex": [["my *parents'* piano", "le piano *de mes parents*"], ["their *cousins'* barbecue", "le barbecue *de leurs cousins*"], ["My *friends’* house has a garden.", "La maison *de mes amis* a un jardin."]]}, {"id": "162", "rule": "Certains mots peuvent utilisés comme adjectifs ou adverbes : _early, fast, late, hard, daily, weekly, monthly, yearly, etc.", "ex": [["The bus arrives *early*.", "Le bus arrive *tôt*."], ["She's an *early* riser.", "C'est une lêve-*tôt*."]]}, {"id": "163", "rule": "Pour exprimer une condition passée, on peut enlever le _if_ (= si) mais il faut inverser le sujet et l'auxiliaire.", "ex": [["*Had the prince explored* the cave, he would have seen the dragon.", "*Le prince eût-il exploré* la grotte, il aurait vu le dragon."]]}, {"id": "164", "rule": "On emploie plus volontiers des interro-négatives qu'en français et elles servent surtout à exprimer l'étonnement, en particulier sous forme exclamative.", "ex": [["*Doesn't the dragon* protect its treasure?!", "*Le dragon ne protège-t-il pas* son trésor ?!"]]}, {"id": "165", "rule": "'il n'a pas dû' 'devoir' se traduit par 'pouvoir' pour la probabilité passée niée.", "ex": [["He *can't have* camped. He hates camping.", "Il *n'a pas dû* camper. Il déteste le camping."]]}, {"id": "166", "rule": "Devant les verbes de perception, on emploie souvent _can_.", "ex": [["The prince *can* see the dragon.", "Le prince *peut* voir le dragon."]]}, {"id": "167", "rule": "Les mots composés sont plus fréquents et l'ordre des mots est souvent inversé.", "ex": [["It's very *densely-populated*.", "C'est très *densément peuplé*."], ["I want a *five-star* hotel.", "Je veux un hôtel *cinq étoiles*."], ["*Long-distance* running is for you.", "La course *d'endurance* est pour toi."], ["You're very *bright-eyed* this morning!", "Tu as les *yeux très vifs* ce matin !"]]}, {"id": "168", "rule": "'Moi aussi/Moi non plus', plus formellement, se disent _So_/_Neither_+ reprise auxiliaire-pronom", "ex": [["The dragon wants treasure. *So does* the prince.", "Le dragon veut du trésor. Le prince *aussi*."], ["The dragon doesn't sleep a lot. *Neither does* the prince.", "Le dragon ne dort pas beaucoup. Le prince *non plus*."]]}, {"id": "169", "rule": "Les noms de famille prennent un s au pluriel.", "ex": [["the *Smiths*", "les *Smith*"], ["the *Taylors*", "les *Taylor*"], ["The *Duponts* explore the jungle.", "Les *Dupont* explorent la jungle."]]}, {"id": "170", "rule": "Pour dire qu'on joue d'un instrument de musique, le 'de la/du' se traduit par _the_.", "ex": [["I play *the piano*.", "Je joue *du piano*."], ["Does anyone play *the guitar*?", "Est-ce que quelqu'un joue *de la guitare* ?"], ["I play *the piano*.", "Je joue *du piano*."], ["He plays *the yukulele*.", "Il joue *du yukulele*."]]}, {"id": "171", "rule": "Les adjectifs composés sont plus fréquents et l'ordre des mots est souvent  inversé par rapport au français.", "ex": []}, {"id": "172", "rule": "Pour la nationalité, le nom et l’adjectif peuvent être différents.", "ex": [["a *Frenchman*, *French*", "un *français*, le *français*"], ["a *Scot*, *Scottish*", "un *écossais*, *écossais*"], ["An *Englishman* is *English*.", "Un *Anglais* est *anglais*."], ["A *Scot* is *Scottish*.", "Un *Ecossais* est *écossais*."]]}, {"id": "173", "rule": "Quand une chose est inférieure, on préfère la structure 'pas aussi … plutôt que' _not as_ … as à 'moins…que' _less … than_.", "ex": [["The  film is *not as long as* the concert.", "Le film *n'est pas aussi long que* le concert."], ["The prince *isn't as big as* the dragon.", "Le prince *n'est pas aussi grand que* le champion."], ["He's *not as blond as* you.", "Il est *moins blond que* toi."]]}, {"id": "174", "rule": "L'ordre des compléments dans les verbes comme 'donner qqch à qqun' est : verbe + destinataire + objet.", "ex": [["The lecturer gives *the students a handout*.", "Le professeur donne *aux étudiants un polycopié*."]]}, {"id": "175", "rule": "Certains mots et certaines expressions ne peuvent pas être \"calqués\" du français à l'anglais. On les appelle des faux-amis ou des expressions idiomatiques ou des gallicismes.", "ex": [["It's *up to you*", "C'est *comme tu veux*."], ["That *sounds good*.", "Ca *me paraît bien* (à l'entendre)."], ["He's *barking mad*.", "Il est *fou à lier*."]]}, {"id": "176", "rule": "Tous les mots en rapport avec la nationalité s'écrivent avec une majuscule, que ce soit l’adjectif, l’habitant ou la langue du pays.", "ex": [["my *Italian* cousins", "mes cousins *italiens*"], ["He is an *American*.", "C'est un *Américain*."], ["My *English* isn’t very good.", "Mon *anglais* n'est pas très bon."], ["Do you speak *French*?", "Parlez-vous *français*?"]]}, {"id": "177", "rule": "_gonna, wanna, kinda, 'cause_ (plutôt que _because_) sont trop familiers pour l'usage scolaire.", "ex": [["I'm *going to* (pas *gonna*) invite your parents.", "J
